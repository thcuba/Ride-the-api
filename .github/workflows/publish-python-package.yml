name: Publish Python Package

# DISABLED — workflow generated by GitHub Copilot.
# It publishes a Python package to GitHub Packages via
#   twine --repository-url https://npm.pkg.github.com/
# but GitHub Packages DISCONTINUED PyPI/python support in 2023
# (github/roadmap#94) — that endpoint is for npm/Java, not Python,
# so every release run fails. Keep the file for reference but never run it.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # DISABLED: see note at top of file.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      
      - name: Build package
        run: python -m build
      
      - name: Publish to GitHub Packages
        run: |
          python -m twine upload \
            --repository-url https://npm.pkg.github.com/ \
            --username github \
            --password ${{ secrets.GITHUB_TOKEN }} \
            dist/*
