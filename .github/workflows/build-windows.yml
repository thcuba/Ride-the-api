name: Build Windows installer

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build PyInstaller onedir
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\pyinstaller_build.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          # Refresca PATH per trovare iscc.exe nello stesso job
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          Write-Host "Inno Setup installed; iscc via choco shim."

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          New-Item -ItemType Directory -Force -Path dist\installer | Out-Null
          iscc //Qp packaging\windows\setup.iss
          Get-ChildItem dist\installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ride-the-api-windows
          path: dist\installer\*.exe

      - name: Attach installer to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\installer\*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}