# Dedicated lint workflow: ruff runs as its own independent status check,
# once, on a single Python version (linting does not depend on the Python
# version). Kept separate from python-package.yml so formatting/pollution
# issues never block the tests and vice versa.

name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Lint with ruff
      run: |
        ruff format --check .
        ruff check .