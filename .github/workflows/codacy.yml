# Codacy Security Scan — static analysis with Docker image caching
# Caches the 25+ Codacy tool Docker images so subsequent runs skip re-pulling
# them. Cache auto-invalidates when the workflow file changes.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '15 14 * * 0'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Restore cached Codacy Docker tool images from a prior run
      - name: Restore cached Codacy Docker images
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          path: /home/runner/.codacy-cache
          key: ${{ runner.os }}-codacy-${{ hashFiles('.github/workflows/codacy.yml') }}
          restore-keys: |
            ${{ runner.os }}-codacy-

      - name: Load cached Docker images
        if: steps.cache-restore.outputs.cache-hit == 'true'
        shell: bash
        run: |
          for f in /home/runner/.codacy-cache/*.tar; do
            [ -f "$f" ] && docker load -i "$f" || true
          done

      - name: Run Codacy Analysis CLI
        continue-on-error: true
        uses: codacy/codacy-analysis-cli-action@master
        with:
          verbose: false
          output: results.sarif
          format: sarif
          max-allowed-issues: 2147483647

      # Save pulled Docker images so subsequent runs skip the pull
      - name: Save Docker images to cache
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p /home/runner/.codacy-cache
          docker images --format "{{.Repository}}::{{.Tag}}" | grep -i codacy | while IFS='::' read -r repo tag; do
            safe=$(echo "${repo}_${tag}" | tr '/:.' '_')
            docker save "${repo}:${tag}" -o "/home/runner/.codacy-cache/${safe}.tar" || true
          done

      - name: Persist cache for next run
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /home/runner/.codacy-cache
          key: ${{ runner.os }}-codacy-${{ hashFiles('.github/workflows/codacy.yml') }}

      # Merge all SARIF runs into a single run to stay within GitHub's 20-run limit
      - name: Merge SARIF runs
        if: always()
        shell: python3
        run: |
          import json, os

          if not os.path.exists('results.sarif'):
              exit(0)

          with open('results.sarif') as f:
              data = json.load(f)

          runs = data.get('runs', [])
          if not runs:
              exit(0)

          all_results = []
          for r in runs:
              all_results.extend(r.get('results', []))

          merged = runs[0]
          merged['results'] = all_results
          merged['tool']['driver']['name'] = 'Codacy (all tools)'
          merged['automationDetails'] = {'id': 'codacy/merged/'}
          data['runs'] = [merged]

          with open('results.sarif', 'w') as f:
              json.dump(data, f)

      - name: Upload SARIF results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif
          wait-for-processing: true
