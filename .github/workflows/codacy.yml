# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '15 14 * * 0'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Cache Docker images downloaded by Codacy CLI to avoid re-pulling 25+ tool images
      - name: Cache Codacy Docker images
        id: cache-codacy
        uses: actions/cache@v4
        with:
          path: /home/runner/.codacy-cache
          key: ${{ runner.os }}-codacy-v1

      - name: Restore cached Docker images
        if: steps.cache-codacy.outputs.cache-hit == 'true'
        run: |
          for f in /home/runner/.codacy-cache/*.tar; do
            [ -f "$f" ] && docker load -i "$f" || true
          done

      - name: Run Codacy Analysis CLI
        continue-on-error: true
        uses: codacy/codacy-analysis-cli-action@master
        with:
          verbose: false
          output: results.sarif
          format: sarif
          max-allowed-issues: 2147483647

      # Save pulled Docker images to cache so subsequent runs skip the pull
      - name: Save Docker images to cache
        if: always() && steps.cache-codacy.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/.codacy-cache
          docker images --format "{{.Repository}}::{{.Tag}}" | grep -i codacy | while IFS='::' read -r repo tag; do
            safe=$(echo "${repo}_${tag}" | tr '/:.' '_')
            docker save "${repo}:${tag}" -o "/home/runner/.codacy-cache/${safe}.tar" || true
          done

      # Merge all SARIF runs into a single run to stay within GitHub's 20-run limit
      - name: Merge SARIF runs
        if: always()
        run: |
          sudo chmod 666 results.sarif || true
          python3 -c "
          import json, os
          if not os.path.exists('results.sarif'):
              exit(0)
          with open('results.sarif') as f:
              data = json.load(f)
          runs = data.get('runs', [])
          if not runs:
              exit(0)
          all_results = []
          for r in runs:
              for result in r.get('results', []):
                  all_results.append(result)
          merged = runs[0]
          merged['results'] = all_results
          merged['tool']['driver']['name'] = 'Codacy (all tools)'
          merged['automationDetails'] = {'id': 'codacy/merged/'}
          data['runs'] = [merged]
          with open('results.sarif', 'w') as f:
              json.dump(data, f)
          "

      - name: Upload SARIF results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif
          wait-for-processing: true
