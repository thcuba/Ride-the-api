# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '15 14 * * 0'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run Codacy Analysis CLI locally without account/token
      # Generates SARIF report for GitHub Code Scanning
      - name: Run Codacy Analysis CLI
        continue-on-error: true
        uses: codacy/codacy-analysis-cli-action@master
        with:
          verbose: false
          output: results.sarif
          format: sarif
          # Run with default security tools only
          max-allowed-issues: 2147483647

      # Add unique automationDetails category to each run in SARIF file to satisfy CodeQL Action upload requirement
      - name: Set unique category per SARIF run
        if: always()
        run: |
          sudo chmod 666 results.sarif || true
          python3 -c "
          import json, os
          if os.path.exists('results.sarif'):
              with open('results.sarif', 'r') as f:
                  data = json.load(f)
              runs = data.get('runs', [])
              for idx, run in enumerate(runs):
                  tool_name = run.get('tool', {}).get('driver', {}).get('name', f'run_{idx}')
                  run['automationDetails'] = {'id': f'codacy-{tool_name.lower()}-{idx}/'}
              with open('results.sarif', 'w') as f:
                  json.dump(data, f, indent=2)
          "

      # Upload the SARIF file to GitHub Code Scanning
      - name: Upload SARIF results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif
          wait-for-processing: true
