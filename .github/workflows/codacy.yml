# Codacy Security Scan — static analysis with GitHub code scanning
# Official docs: https://github.com/codacy/codacy-analysis-cli-action
# Merges all tool runs into one SARIF run to comply with CodeQL's
# single-run-per-category requirement.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '15 14 * * 0'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@master
        with:
          verbose: false
          output: results.sarif
          format: sarif
          force-file-permissions: true
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      # Codacy creates one SARIF run per tool. CodeQL's upload-sarif rejects
      # multiple runs with the same category, so merge into a single run.
      - name: Merge SARIF runs into one
        if: always()
        shell: bash
        run: |
          sudo chmod 666 results.sarif 2>/dev/null || true
          python3 -c "
          import json, os
          if not os.path.exists('results.sarif'):
              exit(0)
          data = json.load(open('results.sarif'))
          runs = data.get('runs', [])
          if not runs:
              exit(0)
          results = []
          for r in runs:
              results.extend(r.get('results', []))
          merged = runs[0]
          merged['results'] = results
          merged['tool']['driver']['name'] = 'Codacy (all tools)'
          merged['automationDetails'] = {'id': 'codacy/merged/'}
          data['runs'] = [merged]
          json.dump(data, open('results.sarif', 'w'))
          print(f'Merged {len(runs)} runs into 1 ({len(results)} issues)')
          "

      - name: Upload SARIF results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif
          wait-for-processing: true