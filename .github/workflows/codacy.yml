# Codacy Security Scan — GitHub code scanning integration
# Official pattern: https://github.com/codacy/codacy-analysis-cli-action

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '15 14 * * 0'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Codacy Analysis CLI
        continue-on-error: true
        uses: codacy/codacy-analysis-cli-action@master
        with:
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          force-file-permissions: true
          max-allowed-issues: 2147483647

      # Codacy creates one SARIF run per tool, but GitHub code scanning limits
      # uploads to 20 runs per category. Merge all runs into one.
      - name: Merge SARIF runs into one
        if: always()
        shell: bash
        run: |
          if [ ! -f results.sarif ]; then
            exit 0
          fi
          python3 << 'EOF'
          import json, os, sys

          if not os.path.exists("results.sarif"):
              sys.exit(0)

          with open("results.sarif") as f:
              data = json.load(f)

          runs = data.get("runs", [])
          if not runs:
              sys.exit(0)

          results = []
          for r in runs:
              results.extend(r.get("results", []))

          merged = runs[0]
          merged["results"] = results
          merged["tool"]["driver"]["name"] = "Codacy (all tools)"
          merged["automationDetails"] = {"id": "codacy/merged/"}
          data["runs"] = [merged]

          with open("results.sarif", "w") as f:
              json.dump(data, f)

          print(f"Merged {len(runs)} runs into 1 ({len(results)} issues)")
          EOF

      - name: Upload SARIF results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif
          wait-for-processing: true