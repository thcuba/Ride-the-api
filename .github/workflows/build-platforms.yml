# Build & release native distributions for every platform.
# PyInstaller cannot cross-compile, so each architecture/OS runs on its own
# GitHub-hosted runner (x64 and arm64 are both available natively).
#
# Triggers:
#   - publishing a GitHub Release -> builds all platforms, attaches assets to it
#   - manual workflow_dispatch    -> builds all platforms, uploads as artifacts
#
# NOTE on macOS: Intel (macOS 13) hosted runners were retired Dec 4 2025;
# only arm64 macOS runners remain, so macOS ships arm64 (Apple Silicon) only.
#
# Two jobs on purpose:
#   1. `build` (matrix)  - compile + package each platform, upload artifact.
#   2. `release`         - single job AFTER all builds; attaches every asset to
#      the release that triggered the run. (Doing the attach inside the matrix
#      would race: 4 parallel jobs uploading to the same release.)

name: Build & Release (multi-platform)

on:
  workflow_dispatch: {}
  release:
    types: [published]

env:
  PYTHON_VERSION: "3.11"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A wedged runner must not hold the release: on 1.2.25 the macOS job hung for 15 minutes and
    # was cancelled, which skipped the release job and left the tag with no assets at all. The
    # matrix builds in a couple of minutes, so fail fast instead of waiting out the default.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            # Pin to Ubuntu 22.04 (glibc 2.35) — NOT ubuntu-latest (24.04,
            # glibc 2.39). PyInstaller bundles inherit the build runner's
            # glibc; building on the newest one yields bundles requiring
            # GLIBC_2.38+, which fail on Debian 12 / HAOS (glibc 2.36) and
            # older Ubuntu. ubuntu-22.04 keeps the widest compatibility among
            # still-hosted Linux images.
            os: ubuntu-22.04
            asset: ride-the-api-linux-x64.tar.gz
          - name: linux-arm64
            os: ubuntu-24.04-arm
            asset: ride-the-api-linux-arm64.tar.gz
          - name: windows-x64
            os: windows-latest
            asset: ride-the-api-windows-x64-setup.exe
          - name: macos-arm64
            os: macos-14
            asset: ride-the-api-macos-arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Tags are needed to record which release the bundle is: the asset has to be able
          # to say "1.2.15", not the static fallback version.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps + PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pyinstaller>=6.0"

      - name: Build PyInstaller onedir
        shell: bash
        run: python -m PyInstaller --noconfirm --clean packaging/rta.spec

      # The frozen bundle reads <install-root>/VERSION to report its release (see
      # core/server.runtime_version). Without this file a prebuilt answers /health with the
      # static fallback version, so the asset lies about what is running.
      - name: Record the bundle version
        shell: bash
        run: |
          # The tag of the release being built is authoritative: an asset must never claim a
          # version other than the release it is attached to. A manual run has no release, so
          # it falls back to the nearest tag plus the distance from it.
          version="${{ github.event.release.tag_name }}"
          [ -n "${version}" ] || version="$(git describe --tags --always)"
          printf '%s\n' "${version}" > VERSION
          # The installer reads its AppVersion from this snippet. It cannot read a file
          # itself: FileRead() is not an ISPP function, and passing the raw text makes Inno
          # evaluate "1.2.16" as an expression ("Integer expression expected"). Quoting it in
          # a #define is the supported way.
          printf '#define AppVersion "%s"\n' "${version}" > version.iss
          echo "bundle version: ${version}"

      # ---- Non-Windows: tar.gz of the onedir bundle + default config dir ----
      # The frozen binary reads config/config.yaml from the CWD (config_manager
      # singleton), NOT from _internal/. Ship a ready-to-use layout:
      #   ride-the-api/                 (binary + _internal + bundled cfg)
      #   config/ certs/ data/ logs/    (runtime dirs next to it)
      - name: Package tar.gz (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/out/config dist/out/certs dist/out/data dist/out/logs
          cp -r dist/ride-the-api dist/out/ride-the-api
          cp config/config.yaml dist/out/config/config.yaml
          cp VERSION dist/out/VERSION
          cd dist/out
          # Write the asset to the workspace root so the upload step's
          # `${{ matrix.asset }}` (relative to $GITHUB_WORKSPACE) finds it.
          tar czf "${GITHUB_WORKSPACE}/${{ matrix.asset }}" .
          # Fail the build rather than ship an asset whose version is wrong. The listing goes
          # to a file on purpose: `tar ... | grep -q` makes grep close the pipe at the first
          # match, tar dies with "write error" and `-o pipefail` fails the build even though
          # the entry was there.
          tar tzf "${GITHUB_WORKSPACE}/${{ matrix.asset }}" > "${RUNNER_TEMP}/bundle-list.txt"
          grep -qx './VERSION' "${RUNNER_TEMP}/bundle-list.txt" \
            || { echo "::error::VERSION is missing from ${{ matrix.asset }}"; exit 1; }
          ls -lh "${GITHUB_WORKSPACE}/${{ matrix.asset }}"

      # ---- Windows: build the Inno Setup installer ----
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress --force
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # choco may report "already installed" without putting iscc.exe on the
          # live PATH, so locate it explicitly instead of relying on `iscc`.
          $candidates = @(
            (Join-Path $env:ProgramFiles (Join-Path "Inno Setup 6" "ISCC.exe")),
            (Join-Path ${env:ProgramFiles(x86)} (Join-Path "Inno Setup 6" "ISCC.exe")),
            (Join-Path $env:TEMP "InnoSetup6\ISCC.exe")
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                    Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw "ISCC.exe not found (did Inno Setup install?)" }
          Write-Host "Using ISCC: $iscc"
          # /Q = quiet (errors only). Do NOT use the MSYS //Qp convention here:
          # this step runs under pwsh, where `//` is not a path escape and is
          # rejected by iscc as "Unknown option: //Qp".
          # The installer reads this file for its AppVersion; keep it next to the payload
          # so the installer and the installed service agree on the release.
          Copy-Item VERSION dist\ride-the-api\VERSION -Force
          if (-not (Test-Path "dist\ride-the-api\VERSION")) { throw "VERSION was not staged" }
          & $iscc /Q packaging\windows\setup.iss
          Get-ChildItem dist\installer\ride-the-api-setup.exe
          Copy-Item dist\installer\ride-the-api-setup.exe "${{ matrix.asset }}"

      # The asset must be at a stable, discoverable path for the release job.
      - name: Upload platform artifact
        uses: actions/upload-artifact@v7
        with:
          name: rta-${{ matrix.name }}
          path: ${{ matrix.asset }}

  release:
    # Runs after every build job succeeded, only when triggered by a published
    # release. The release already exists, so this job only attaches the built
    # assets to it. (On workflow_dispatch there is no release to update: the
    # build job just uploads artifacts.)
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # attach assets to the GitHub Release
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: List assets
        run: ls -lh assets

      - name: Generate checksums
        working-directory: assets
        run: |
          # The bundle is executed as-is after download, so an installer must be able to prove the
          # artefact is the one this workflow produced. One file next to the assets, covering every
          # platform; `files: assets/*` below attaches it to the release with the rest.
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Attach assets to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
