<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ride the API — Configuration</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="apple-touch-icon" href="/static/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  // Apply persisted theme as early as possible to avoid a flash of colour.
  (function () {
    try {
      var t = localStorage.getItem('rta-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0e14; --surface: #141820; --surface2: #1a1f2b; --border: #2d3648;
    --text: #e1e6ed; --text2: #9ca8ba; --accent: #6c8cff; --accent2: #5b7ad0;
    --green: #34d399; --yellow: #fbbf24; --red: #f87171; --blue: #60a5fa;
    --radius: 12px; --shadow: 0 8px 32px rgba(0,0,0,.3);
  }
  [data-theme="light"] {
    --bg: #f4f6fb; --surface: #ffffff; --surface2: #eef1f7; --border: #d2dae8;
    --text: #1b2233; --text2: #5a6577; --accent: #4a63e0; --accent2: #3f55c2;
    --green: #16a34a; --yellow: #d97706; --red: #dc2626; --blue: #2563eb;
    --radius: 12px; --shadow: 0 8px 32px rgba(20,30,60,.12);
  }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg); color: var(--text); padding: 24px; min-height: 100vh;
    background-image: radial-gradient(ellipse at 20% 10%, rgba(108,140,255,.08) 0%, transparent 50%),
                      radial-gradient(ellipse at 80% 90%, rgba(52,211,153,.06) 0%, transparent 50%);
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .skip-link { position: absolute; top: -100%; left: 8px; padding: 8px 16px; background: var(--accent); color: #fff; border-radius: 0 0 8px 8px; font-size: 14px; font-weight: 600; z-index: 9999; text-decoration: none; }
  .skip-link:focus { top: 0; }

  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .header-left { display: flex; flex-direction: column; }
  .header-left h1 { font-size: 28px; font-weight: 800; color: var(--accent); letter-spacing: -.5px; }
  .header-left .subtitle { font-size: 14px; color: var(--text2); margin-top: 2px; }
  .brand-row { display: flex; align-items: center; gap: 10px; }
  .brand-row img { border-radius: 8px; }
  .header-actions { display: flex; gap: 10px; align-items: center; }
  .path-chip { font-size: 12px; color: var(--text2); background: var(--surface2); border: 1px solid var(--border); padding: 5px 10px; border-radius: 8px; font-family: ui-monospace, monospace; }

  .btn { padding: 8px 18px; border: none; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; box-shadow: 0 4px 14px rgba(108,140,255,.25); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(108,140,255,.35); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); background: rgba(108,140,255,.1); }
  .btn-ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Layout */
  .layout { display: flex; gap: 20px; align-items: flex-start; }
  .sidebar {
    width: 280px; flex-shrink: 0; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px; position: sticky; top: 20px;
    max-height: calc(100vh - 120px); display: flex; flex-direction: column; gap: 6px;
    box-shadow: var(--shadow);
  }
  .sidebar-header {
    display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 6px;
  }
  .sidebar-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--text2); font-weight: 700;
  }
  .sidebar-badge {
    font-size: 11px; font-weight: 600; color: var(--text2); background: var(--surface2);
    border: 1px solid var(--border); padding: 1px 7px; border-radius: 999px; font-variant-numeric: tabular-nums;
  }
  .sidebar-search-wrap {
    position: relative; margin-bottom: 4px;
  }
  .sidebar-search-icon {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; color: var(--text2); pointer-events: none;
  }
  .sidebar-search {
    width: 100%; box-sizing: border-box; background: var(--surface2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 28px 7px 30px;
    font-size: 12px; font-family: inherit; transition: border-color .15s, box-shadow .15s;
  }
  .sidebar-search:focus {
    outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  .sidebar-search::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .sidebar-search-wrap .search-kbd {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 4px; color: var(--text2);
    font-family: inherit; font-size: 10px; font-weight: 600; padding: 1px 5px; line-height: 1.3; transition: opacity .15s;
  }
  .sidebar-search:focus ~ .search-kbd, .sidebar-search:not(:placeholder-shown) ~ .search-kbd { opacity: 0; }
  .sidebar-search-wrap .clear-search-btn {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none;
    color: var(--text2); font-size: 15px; cursor: pointer; padding: 2px 4px; border-radius: 4px; line-height: 1; display: none;
  }
  .sidebar-search-wrap .clear-search-btn:hover { color: var(--text); }
  .sidebar-search-wrap .clear-search-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  .sidebar-items {
    overflow-y: auto; display: flex; flex-direction: column; gap: 3px; padding-right: 2px;
    flex: 1; min-height: 0;
  }
  .sidebar-empty {
    font-size: 12px; color: var(--text2); padding: 16px 8px; text-align: center;
    font-style: italic;
  }
  .sidebar-divider {
    height: 1px; background: var(--border); margin: 6px 4px 2px;
  }
  .sidebar-footer-label {
    padding: 4px 6px 2px;
  }

  .section-item {
    display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left;
    padding: 7px 9px; border: 1px solid transparent; background: transparent; color: var(--text);
    font-family: inherit; border-radius: 8px; cursor: pointer; transition: all .16s ease;
    gap: 8px;
  }
  .section-item:hover {
    background: var(--surface2);
    border-color: color-mix(in srgb, var(--border) 60%, transparent);
  }
  .section-item:focus-visible {
    outline: 2px solid var(--accent); outline-offset: -2px;
    box-shadow: var(--focus-ring, 0 0 0 3px rgba(108,140,255,.25));
  }
  .section-item.active {
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 18%, var(--surface)), color-mix(in srgb, var(--accent2) 26%, var(--surface)));
    border-color: color-mix(in srgb, var(--accent) 55%, transparent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(108,140,255,.15);
  }
  .section-item-main {
    display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1;
  }
  .section-item-icon {
    width: 28px; height: 28px; border-radius: 6px; display: inline-flex; align-items: center;
    justify-content: center; background: var(--surface2); color: var(--text2);
    flex-shrink: 0; transition: color .15s, background .15s;
  }
  .sec-icon {
    width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .section-item:hover .section-item-icon {
    color: var(--text);
    background: color-mix(in srgb, var(--surface2) 80%, white 20%);
  }
  .section-item.active .section-item-icon {
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 20%, transparent);
  }
  .section-item-text {
    display: flex; flex-direction: column; gap: 1px; min-width: 0;
  }
  .section-item-name {
    font-size: 13px; font-weight: 600; line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .section-item-key {
    font-size: 10px; font-weight: 400; color: var(--text2); font-family: ui-monospace, monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .section-item.active .section-item-key {
    color: color-mix(in srgb, var(--text) 85%, white);
  }
  .section-item .count {
    min-width: 11px;
    height: 11px;
    padding: 0 4px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 700;
    line-height: 11px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: color-mix(in srgb, var(--surface2) 80%, var(--border));
    color: var(--text2);
    border: 1px solid var(--border);
    flex-shrink: 0;
    transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
    font-variant-numeric: tabular-nums;
  }
  .section-item:hover .count {
    background: color-mix(in srgb, var(--accent) 30%, var(--surface2));
    border-color: var(--accent);
    box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 70%, transparent), 0 0 3px var(--accent);
    color: #fff;
    transform: scale(1.15);
  }
  .section-item.active .count {
    background: #ffffff;
    border-color: #ffffff;
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.9), 0 0 18px var(--accent);
    color: var(--accent);
    transform: scale(1.18);
  }
  [data-theme="light"] .section-item.active .count {
    background: #ffffff;
    border-color: #ffffff;
    box-shadow: 0 0 10px rgba(74, 99, 224, 0.6), 0 2px 6px rgba(0, 0, 0, 0.15);
    color: var(--accent);
  }
  .section-item.dirty-section .count {
    min-width: 16px;
    height: 16px;
    padding: 1px 6px;
    background: rgba(251, 191, 36, 0.2);
    color: var(--yellow);
    border-color: rgba(251, 191, 36, 0.5);
    box-shadow: 0 0 8px rgba(251, 191, 36, 0.4);
    font-weight: 700;
  }
  .section-item.dirty-section:not(.active) {
    border-left: 3px solid var(--yellow);
  }
  .section-item.dirty-section:hover .count {
    background: rgba(251, 191, 36, 0.35);
    border-color: var(--yellow);
    box-shadow: 0 0 12px rgba(251, 191, 36, 0.7);
    color: var(--yellow);
    transform: scale(1.1);
  }
  .section-item.active.dirty-section .count {
    background: var(--yellow);
    color: #0b0e14;
    border-color: #ffffff;
    box-shadow: 0 0 14px rgba(251, 191, 36, 0.95), 0 0 4px #ffffff;
    transform: scale(1.1);
  }

  /* Content */
  .content { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; min-width: 0; box-shadow: var(--shadow); }
  .content h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; text-transform: capitalize; }
  .content .sec-desc { font-size: 13px; color: var(--text2); margin-bottom: 22px; line-height: 1.5; }
  
  .field-group {
    background: color-mix(in srgb, var(--surface2) 40%, var(--surface));
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 12px;
    transition: border-color .15s ease;
  }
  .field-group:hover {
    border-color: color-mix(in srgb, var(--border) 85%, var(--accent) 15%);
  }
  .field-group-title {
    font-size: 13px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .4px;
    cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: space-between;
    padding: 6px 4px; border-radius: 6px; min-height: 40px; transition: background .15s;
    margin-bottom: 8px;
  }
  .field-group-title:hover {
    background: color-mix(in srgb, var(--surface2) 80%, transparent);
  }
  .field-group-title:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .field-group-title-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .chev-svg {
    width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2;
    stroke-linecap: round; stroke-linejoin: round; transition: transform .2s ease;
    flex-shrink: 0;
  }
  .chev-svg.collapsed { transform: rotate(-90deg); }

  .field {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 20px;
    padding: 10px 0; border-bottom: 1px solid color-mix(in srgb, var(--border) 50%, transparent);
  }
  .field:last-child { border-bottom: none; }
  .field.field-switch {
    align-items: center; min-height: 44px;
  }
  .field .f-info { min-width: 0; flex: 1; padding-top: 2px; }
  .field .f-name { font-size: 13.5px; font-weight: 600; cursor: pointer; color: var(--text); }
  .field .f-desc { font-size: 11.5px; color: var(--text2); margin-top: 3px; line-height: 1.45; word-break: break-word; }
  .field .f-control { flex-shrink: 0; display: flex; align-items: center; }

  /* Field help: name row, "?" affordance, machine path, copy shortcut */
  .field .f-name-row { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .field .f-help {
    width: 17px; height: 17px; padding: 0; border-radius: 50%; cursor: help;
    border: 1px solid var(--border); background: var(--surface2); color: var(--text2);
    font-size: 11px; font-weight: 700; line-height: 1; display: inline-flex;
    align-items: center; justify-content: center; flex-shrink: 0;
  }
  .field .f-help:hover, .field .f-help:focus-visible { color: var(--accent); border-color: var(--accent); outline: none; }
  .field .f-path {
    display: inline-block; margin-top: 3px; font-family: ui-monospace, monospace;
    font-size: 10.5px; color: color-mix(in srgb, var(--text2) 75%, transparent);
    word-break: break-all;
  }
  .field .f-copy {
    border: 1px solid transparent; background: transparent; color: var(--text2);
    border-radius: 5px; cursor: pointer; padding: 0 4px; font-size: 10.5px;
    opacity: 0; transition: opacity .12s ease, color .12s ease;
  }
  .field:hover .f-copy, .field .f-copy:focus-visible { opacity: 1; }
  .field .f-copy:hover { color: var(--accent); border-color: var(--border); }
  .field-group-title .fg-hint {
    font-size: 11px; font-weight: 500; text-transform: none; letter-spacing: 0;
    color: var(--text2); margin-left: 10px;
  }

  /* Instant hover tooltip, shared by every explained control */
  .hover-tip {
    position: fixed; z-index: 9999; max-width: 340px; pointer-events: none;
    background: var(--surface2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.45;
    box-shadow: 0 8px 24px rgba(0,0,0,.35); opacity: 0; transition: opacity .1s ease;
  }
  .hover-tip.show { opacity: 1; }

  /* Quick actions offered on top of a section */
  .sec-quick { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .sec-quick .btn { font-size: 12px; padding: 6px 12px; }

  .field input[type="text"], .field input[type="number"], .field textarea, .field select {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 13.5px; font-family: inherit; min-width: 220px; min-height: 42px;
    transition: border-color .15s, box-shadow .15s;
  }
  .field input[type="text"] { width: 300px; }
  .field input[type="number"] { width: 170px; }
  .field textarea { width: 440px; min-height: 85px; resize: vertical; line-height: 1.45; font-family: ui-monospace, monospace; font-size: 12.5px; }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  .field select { min-width: 220px; cursor: pointer; }

  /* Smooth, touch-friendly toggle switch */
  .switch-wrap {
    display: inline-flex; align-items: center; cursor: pointer; min-height: 44px; min-width: 48px;
  }
  input[type="checkbox"].switch {
    appearance: none; -webkit-appearance: none; width: 48px; height: 26px;
    background: var(--border); border-radius: 26px; position: relative; cursor: pointer;
    transition: background-color .22s ease, box-shadow .15s ease; border: none; margin: 0;
    flex-shrink: 0;
  }
  input[type="checkbox"].switch::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    background: #fff; border-radius: 50%; transition: left .22s ease, transform .15s ease;
    box-shadow: 0 2px 4px rgba(0,0,0,.28);
  }
  input[type="checkbox"].switch:checked { background: var(--green); }
  input[type="checkbox"].switch:checked::after { left: 25px; }
  input[type="checkbox"].switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type="checkbox"].switch:active::after { transform: scale(1.08); }

  .pw-wrap {
    position: relative; display: flex; align-items: center; width: 100%;
  }
  .pw-toggle-btn {
    position: absolute; right: 4px; width: 36px; height: 36px; border: none; background: transparent;
    color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center;
    border-radius: 6px; transition: color .15s, background-color .15s;
  }
  .pw-toggle-btn:hover { color: var(--text); background: rgba(255,255,255,.08); }
  .pw-toggle-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .list-badge { display: inline-flex; flex-wrap: wrap; gap: 5px; }
  .list-badge .lb { font-size: 11px; background: var(--surface2); border: 1px solid var(--border); padding: 3px 8px; border-radius: 10px; color: var(--text2); font-family: ui-monospace, monospace; }

  .btn-remove {
    padding: 4px 10px; font-size: 12px; min-height: 32px; border-radius: 6px;
    color: var(--text2); transition: all .15s;
  }
    /* Glowing button pill micro-interaction */
  .btn-glow-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    margin-left: 6px;
    background: color-mix(in srgb, var(--surface) 60%, transparent);
    border: 1px solid var(--border);
    color: var(--text2);
    transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .btn:hover .btn-glow-pill,
  .btn:focus-visible .btn-glow-pill {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.65);
    transform: scale(1.08);
  }
  .btn-primary:hover .btn-glow-pill,
  .btn-primary:focus-visible .btn-glow-pill {
    background: #ffffff;
    color: var(--accent);
    border-color: #ffffff;
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.9), 0 0 6px var(--accent);
    transform: scale(1.1);
  }

  .btn-remove:hover {
    color: var(--red); border-color: color-mix(in srgb, var(--red) 50%, transparent);
    background: color-mix(in srgb, var(--red) 12%, transparent);
  }

  .save-bar { display: flex; align-items: center; gap: 12px; justify-content: flex-end; margin-top: 14px; padding-top: 16px; border-top: 1px solid var(--border); }
  .save-bar .status { font-size: 12px; color: var(--text2); }
  .save-bar .status.ok { color: var(--green); }
  .save-bar .status.err { color: var(--red); max-width: 60ch; white-space: pre-wrap; }

  .dirty { border-left: 3px solid var(--yellow) !important; }
  .toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 1000; }
  .toast { background: var(--surface2); border: 1px solid var(--border); padding: 10px 16px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow); opacity: 0; transition: opacity .3s; display: flex; align-items: center; gap: 8px; }
  .toast.show { opacity: 1; }
  .toast.success { border-color: var(--green); }
  .toast.error { border-color: var(--red); }
  .toast-icon { font-weight: 700; }

  /* ── Responsive: tablet (≤900px) ───────────────────────────────────────── */
  @media (max-width: 900px) {
    .content { padding: 18px; }
    .field input[type="text"] { width: 100%; }
  }

  /* ── Responsive: mobile (≤600px) ───────────────────────────────────────── */
  @media (max-width: 600px) {
    body { padding: 12px; }
    .header { gap: 10px; margin-bottom: 18px; }
    .header-left h1 { font-size: 22px; }
    .brand-row img { width: 34px; height: 34px; }
    .header-actions { width: 100%; display: flex; justify-content: space-between; gap: 8px; }
    .header-actions .btn { width: 100%; min-height: 44px; justify-content: center; font-size: 14px; }
    .path-chip { display: none; }
