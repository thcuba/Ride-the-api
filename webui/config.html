<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ride the API — Configuration</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="apple-touch-icon" href="/static/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  // Apply persisted theme as early as possible to avoid a flash of colour.
  (function () {
    try {
      var t = localStorage.getItem('rta-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0e14; --surface: #141820; --surface2: #1a1f2b; --border: #2d3648;
    --text: #e1e6ed; --text2: #9ca8ba; --accent: #6c8cff; --accent2: #5b7ad0;
    --green: #34d399; --yellow: #fbbf24; --red: #f87171; --blue: #60a5fa;
    --radius: 12px; --shadow: 0 8px 32px rgba(0,0,0,.3);
  }
  [data-theme="light"] {
    --bg: #f4f6fb; --surface: #ffffff; --surface2: #eef1f7; --border: #d2dae8;
    --text: #1b2233; --text2: #5a6577; --accent: #4a63e0; --accent2: #3f55c2;
    --green: #16a34a; --yellow: #d97706; --red: #dc2626; --blue: #2563eb;
    --radius: 12px; --shadow: 0 8px 32px rgba(20,30,60,.12);
  }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg); color: var(--text); padding: 24px; min-height: 100vh;
    background-image: radial-gradient(ellipse at 20% 10%, rgba(108,140,255,.08) 0%, transparent 50%),
                      radial-gradient(ellipse at 80% 90%, rgba(52,211,153,.06) 0%, transparent 50%);
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .skip-link { position: absolute; top: -100%; left: 8px; padding: 8px 16px; background: var(--accent); color: #fff; border-radius: 0 0 8px 8px; font-size: 14px; font-weight: 600; z-index: 9999; text-decoration: none; }
  .skip-link:focus { top: 0; }

  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .header-left { display: flex; flex-direction: column; }
  .header-left h1 { font-size: 28px; font-weight: 800; color: var(--accent); letter-spacing: -.5px; }
  .header-left .subtitle { font-size: 14px; color: var(--text2); margin-top: 2px; }
  .brand-row { display: flex; align-items: center; gap: 10px; }
  .brand-row img { border-radius: 8px; }
  .header-actions { display: flex; gap: 10px; align-items: center; }
  .path-chip { font-size: 12px; color: var(--text2); background: var(--surface2); border: 1px solid var(--border); padding: 5px 10px; border-radius: 8px; font-family: ui-monospace, monospace; }

  .btn { padding: 8px 18px; border: none; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; box-shadow: 0 4px 14px rgba(108,140,255,.25); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(108,140,255,.35); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); background: rgba(108,140,255,.1); }
  .btn-ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Layout */
  .layout { display: flex; gap: 20px; align-items: flex-start; }
  .sidebar {
    width: 280px; flex-shrink: 0; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px; position: sticky; top: 20px;
    max-height: calc(100vh - 120px); display: flex; flex-direction: column; gap: 6px;
    box-shadow: var(--shadow);
  }
  .sidebar-header {
    display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 6px;
  }
  .sidebar-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--text2); font-weight: 700;
  }
  .sidebar-badge {
    font-size: 11px; font-weight: 600; color: var(--text2); background: var(--surface2);
    border: 1px solid var(--border); padding: 1px 7px; border-radius: 999px; font-variant-numeric: tabular-nums;
  }
  .sidebar-search-wrap {
    position: relative; margin-bottom: 4px;
  }
  .sidebar-search-icon {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; color: var(--text2); pointer-events: none;
  }
  .sidebar-search {
    width: 100%; box-sizing: border-box; background: var(--surface2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px 7px 30px;
    font-size: 12px; font-family: inherit; transition: border-color .15s, box-shadow .15s;
  }
  .sidebar-search:focus {
    outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  .sidebar-items {
    overflow-y: auto; display: flex; flex-direction: column; gap: 3px; padding-right: 2px;
    flex: 1; min-height: 0;
  }
  .sidebar-empty {
    font-size: 12px; color: var(--text2); padding: 16px 8px; text-align: center;
    font-style: italic;
  }
  .sidebar-divider {
    height: 1px; background: var(--border); margin: 6px 4px 2px;
  }
  .sidebar-footer-label {
    padding: 4px 6px 2px;
  }

  .section-item {
    display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left;
    padding: 7px 9px; border: 1px solid transparent; background: transparent; color: var(--text);
    font-family: inherit; border-radius: 8px; cursor: pointer; transition: all .16s ease;
    gap: 8px;
  }
  .section-item:hover {
    background: var(--surface2);
    border-color: color-mix(in srgb, var(--border) 60%, transparent);
  }
  .section-item:focus-visible {
    outline: 2px solid var(--accent); outline-offset: -2px;
    box-shadow: var(--focus-ring, 0 0 0 3px rgba(108,140,255,.25));
  }
  .section-item.active {
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 18%, var(--surface)), color-mix(in srgb, var(--accent2) 26%, var(--surface)));
    border-color: color-mix(in srgb, var(--accent) 55%, transparent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(108,140,255,.15);
  }
  .section-item-main {
    display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1;
  }
  .section-item-icon {
    width: 28px; height: 28px; border-radius: 6px; display: inline-flex; align-items: center;
    justify-content: center; background: var(--surface2); color: var(--text2);
    flex-shrink: 0; transition: color .15s, background .15s;
  }
  .sec-icon {
    width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .section-item:hover .section-item-icon {
    color: var(--text);
    background: color-mix(in srgb, var(--surface2) 80%, white 20%);
  }
  .section-item.active .section-item-icon {
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 20%, transparent);
  }
  .section-item-text {
    display: flex; flex-direction: column; gap: 1px; min-width: 0;
  }
  .section-item-name {
    font-size: 13px; font-weight: 600; line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .section-item-key {
    font-size: 10px; font-weight: 400; color: var(--text2); font-family: ui-monospace, monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .section-item.active .section-item-key {
    color: color-mix(in srgb, var(--text) 85%, white);
  }
  .section-item .count {
    min-width: 11px;
    height: 11px;
    padding: 0 4px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 700;
    line-height: 11px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: color-mix(in srgb, var(--surface2) 80%, var(--border));
    color: var(--text2);
    border: 1px solid var(--border);
    flex-shrink: 0;
    transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
    font-variant-numeric: tabular-nums;
  }
  .section-item:hover .count {
    background: color-mix(in srgb, var(--accent) 30%, var(--surface2));
    border-color: var(--accent);
    box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 70%, transparent), 0 0 3px var(--accent);
    color: #fff;
    transform: scale(1.15);
  }
  .section-item.active .count {
    background: #ffffff;
    border-color: #ffffff;
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.9), 0 0 18px var(--accent);
    color: var(--accent);
    transform: scale(1.18);
  }
  [data-theme="light"] .section-item.active .count {
    background: #ffffff;
    border-color: #ffffff;
    box-shadow: 0 0 10px rgba(74, 99, 224, 0.6), 0 2px 6px rgba(0, 0, 0, 0.15);
    color: var(--accent);
  }
  .section-item.dirty-section .count {
    min-width: 16px;
    height: 16px;
    padding: 1px 6px;
    background: rgba(251, 191, 36, 0.2);
    color: var(--yellow);
    border-color: rgba(251, 191, 36, 0.5);
    box-shadow: 0 0 8px rgba(251, 191, 36, 0.4);
    font-weight: 700;
  }
  .section-item.dirty-section:not(.active) {
    border-left: 3px solid var(--yellow);
  }
  .section-item.dirty-section:hover .count {
    background: rgba(251, 191, 36, 0.35);
    border-color: var(--yellow);
    box-shadow: 0 0 12px rgba(251, 191, 36, 0.7);
    color: var(--yellow);
    transform: scale(1.1);
  }
  .section-item.active.dirty-section .count {
    background: var(--yellow);
    color: #0b0e14;
    border-color: #ffffff;
    box-shadow: 0 0 14px rgba(251, 191, 36, 0.95), 0 0 4px #ffffff;
    transform: scale(1.1);
  }

  /* Content */
  .content { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; min-width: 0; box-shadow: var(--shadow); }
  .content h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; text-transform: capitalize; }
  .content .sec-desc { font-size: 13px; color: var(--text2); margin-bottom: 22px; line-height: 1.5; }
  
  .field-group {
    background: color-mix(in srgb, var(--surface2) 40%, var(--surface));
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 12px;
    transition: border-color .15s ease;
  }
  .field-group:hover {
    border-color: color-mix(in srgb, var(--border) 85%, var(--accent) 15%);
  }
  .field-group-title {
    font-size: 13px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .4px;
    cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: space-between;
    padding: 6px 4px; border-radius: 6px; min-height: 40px; transition: background .15s;
    margin-bottom: 8px;
  }
  .field-group-title:hover {
    background: color-mix(in srgb, var(--surface2) 80%, transparent);
  }
  .field-group-title:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .field-group-title-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .chev-svg {
    width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2;
    stroke-linecap: round; stroke-linejoin: round; transition: transform .2s ease;
    flex-shrink: 0;
  }
  .chev-svg.collapsed { transform: rotate(-90deg); }

  .field {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 20px;
    padding: 10px 0; border-bottom: 1px solid color-mix(in srgb, var(--border) 50%, transparent);
  }
  .field:last-child { border-bottom: none; }
  .field.field-switch {
    align-items: center; min-height: 44px;
  }
  .field .f-info { min-width: 0; flex: 1; padding-top: 2px; }
  .field .f-name { font-size: 13.5px; font-weight: 600; cursor: pointer; color: var(--text); }
  .field .f-desc { font-size: 11.5px; color: var(--text2); margin-top: 3px; line-height: 1.45; word-break: break-word; }
  .field .f-control { flex-shrink: 0; display: flex; align-items: center; }

  .field input[type="text"], .field input[type="number"], .field textarea, .field select {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 13.5px; font-family: inherit; min-width: 220px; min-height: 42px;
    transition: border-color .15s, box-shadow .15s;
  }
  .field input[type="text"] { width: 300px; }
  .field input[type="number"] { width: 170px; }
  .field textarea { width: 440px; min-height: 85px; resize: vertical; line-height: 1.45; font-family: ui-monospace, monospace; font-size: 12.5px; }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  .field select { min-width: 220px; cursor: pointer; }

  /* Smooth, touch-friendly toggle switch */
  .switch-wrap {
    display: inline-flex; align-items: center; cursor: pointer; min-height: 44px; min-width: 48px;
  }
  input[type="checkbox"].switch {
    appearance: none; -webkit-appearance: none; width: 48px; height: 26px;
    background: var(--border); border-radius: 26px; position: relative; cursor: pointer;
    transition: background-color .22s ease, box-shadow .15s ease; border: none; margin: 0;
    flex-shrink: 0;
  }
  input[type="checkbox"].switch::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    background: #fff; border-radius: 50%; transition: left .22s ease, transform .15s ease;
    box-shadow: 0 2px 4px rgba(0,0,0,.28);
  }
  input[type="checkbox"].switch:checked { background: var(--green); }
  input[type="checkbox"].switch:checked::after { left: 25px; }
  input[type="checkbox"].switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type="checkbox"].switch:active::after { transform: scale(1.08); }

  .pw-wrap {
    position: relative; display: flex; align-items: center; width: 100%;
  }
  .pw-toggle-btn {
    position: absolute; right: 4px; width: 36px; height: 36px; border: none; background: transparent;
    color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center;
    border-radius: 6px; transition: color .15s, background-color .15s;
  }
  .pw-toggle-btn:hover { color: var(--text); background: rgba(255,255,255,.08); }
  .pw-toggle-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .list-badge { display: inline-flex; flex-wrap: wrap; gap: 5px; }
  .list-badge .lb { font-size: 11px; background: var(--surface2); border: 1px solid var(--border); padding: 3px 8px; border-radius: 10px; color: var(--text2); font-family: ui-monospace, monospace; }

  .btn-remove {
    padding: 4px 10px; font-size: 12px; min-height: 32px; border-radius: 6px;
    color: var(--text2); transition: all .15s;
  }
    /* Glowing button pill micro-interaction */
  .btn-glow-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    margin-left: 6px;
    background: color-mix(in srgb, var(--surface) 60%, transparent);
    border: 1px solid var(--border);
    color: var(--text2);
    transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .btn:hover .btn-glow-pill,
  .btn:focus-visible .btn-glow-pill {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.65);
    transform: scale(1.08);
  }
  .btn-primary:hover .btn-glow-pill,
  .btn-primary:focus-visible .btn-glow-pill {
    background: #ffffff;
    color: var(--accent);
    border-color: #ffffff;
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.9), 0 0 6px var(--accent);
    transform: scale(1.1);
  }

  .btn-remove:hover {
    color: var(--red); border-color: color-mix(in srgb, var(--red) 50%, transparent);
    background: color-mix(in srgb, var(--red) 12%, transparent);
  }

  .save-bar { display: flex; align-items: center; gap: 12px; justify-content: flex-end; margin-top: 14px; padding-top: 16px; border-top: 1px solid var(--border); }
  .save-bar .status { font-size: 12px; color: var(--text2); }
  .save-bar .status.ok { color: var(--green); }
  .save-bar .status.err { color: var(--red); max-width: 60ch; white-space: pre-wrap; }

  .dirty { border-left: 3px solid var(--yellow) !important; }
  .toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 1000; }
  .toast { background: var(--surface2); border: 1px solid var(--border); padding: 10px 16px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow); opacity: 0; transition: opacity .3s; display: flex; align-items: center; gap: 8px; }
  .toast.show { opacity: 1; }
  .toast.success { border-color: var(--green); }
  .toast.error { border-color: var(--red); }
  .toast-icon { font-weight: 700; }

  /* ── Responsive: tablet (≤900px) ───────────────────────────────────────── */
  @media (max-width: 900px) {
    .content { padding: 18px; }
    .field input[type="text"] { width: 100%; }
  }

  /* ── Responsive: mobile (≤600px) ───────────────────────────────────────── */
  @media (max-width: 600px) {
    body { padding: 12px; }
    .header { gap: 10px; margin-bottom: 18px; }
    .header-left h1 { font-size: 22px; }
    .brand-row img { width: 34px; height: 34px; }
    .header-actions { width: 100%; display: flex; justify-content: space-between; gap: 8px; }
    .header-actions .btn { width: 100%; min-height: 44px; justify-content: center; font-size: 14px; }
    .path-chip { display: none; }
    .layout { flex-direction: column; gap: 14px; }
    .sidebar {
      width: 100%; position: static; max-height: none; padding: 10px;
    }
    .sidebar-items {
      flex-direction: row; flex-wrap: wrap; gap: 6px; max-height: 260px;
    }
    .section-item {
      width: auto; flex: 1 1 calc(50% - 6px); min-width: 130px; padding: 8px;
    }
    .content { padding: 16px 12px; border-radius: 12px; }
    .content h2 { font-size: 19px; }
    .field-group { padding: 10px 12px; margin-bottom: 10px; }
    
    /* Inputs prevent iOS auto-zoom via >=16px font-size */
    .field input[type="text"], .field input[type="number"], .field textarea, .field select {
      font-size: 16px !important; min-height: 46px; width: 100%; min-width: 0;
    }
    .field:not(.field-switch) { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px 0; }
    .field.field-switch { flex-direction: row; justify-content: space-between; align-items: center; padding: 10px 0; }
    .field .f-info { padding-top: 0; }
    .field .f-control { width: auto; }
    .field:not(.field-switch) .f-control { width: 100%; }
    .field:not(.field-switch) .f-control input, .field:not(.field-switch) .f-control select, .field:not(.field-switch) .f-control textarea { width: 100%; }
    
    /* Touch-friendly sticky save bar */
    .save-bar {
      position: sticky; bottom: 10px; z-index: 900;
      background: color-mix(in srgb, var(--surface) 94%, black 6%);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      padding: 12px 14px; border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0,0,0,.45);
      border: 1px solid var(--border);
      margin-top: 16px; flex-direction: column; align-items: stretch; gap: 8px;
    }
    .save-bar .status { text-align: center; font-size: 12px; }
    .save-bar .btn { width: 100%; min-height: 46px; justify-content: center; font-size: 14px; }
    
    .toast-container { bottom: 12px; right: 12px; left: 12px; }
    .toast { width: 100%; }
    .list-badge { flex-wrap: wrap; width: 100%; }
  }
</style>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to content</a>
<div class="toast-container" id="toasts" role="status" aria-live="polite" aria-atomic="true"></div>

<div class="header">
  <div class="header-left">
    <div class="brand-row">
      <img src="/static/logo.png" alt="ride-the-api logo" width="40" height="40">
      <h1>Configuration</h1>
    </div>
    <span class="subtitle">Full config.yaml editor — read, modify and persist every section</span>
    <nav class="primary-nav" aria-label="Primary navigation">
      <a href="/">Dashboard</a>
      <a href="/patterns">Patterns</a>
      <a href="/config" aria-current="page">Configuration</a>
      <a href="/#llm-settings">LLM Settings</a>
      <a href="/options">Options</a>
    </nav>
  </div>
  <div class="header-actions">
    <span class="path-chip" id="configPath">…</span>
    <button class="btn btn-primary" id="saveBtn" onclick="saveConfig()" aria-label="Save all configuration changes" title="No unsaved changes (Ctrl+S)" disabled>&#x2714; Save All</button>
  </div>
</div>

<div class="layout">

<script>
// ── Control-plane auth (same as dashboard) ──────────────────────────────────
(function () {
  const KEY_STORAGE = 'rideApiKey';
  const SESSION_STORAGE = 'rideSessionKey';
  let apiKey = localStorage.getItem(KEY_STORAGE) || sessionStorage.getItem(SESSION_STORAGE) || '';

  function storeKey(key, remember) {
    if (remember) {
      localStorage.setItem(KEY_STORAGE, key);
      sessionStorage.removeItem(SESSION_STORAGE);
    } else {
      sessionStorage.setItem(SESSION_STORAGE, key);
      localStorage.removeItem(KEY_STORAGE);
    }
  }

  // Ask the user whether to remember the key on this machine for automatic
  // entry. Resolves true = save to localStorage, false = current session only.
  function askRememberKey(key) {
    return new Promise(function (resolve) {
      const overlay = document.createElement('div');
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-modal', 'true');
      overlay.setAttribute('aria-labelledby', 'remember-key-title');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9500;';
      const box = document.createElement('div');
      box.style.cssText = 'background:#141820;border:1px solid #2d3648;border-radius:12px;padding:24px;max-width:440px;width:90%;color:#e1e6ed;font-family:Inter,system-ui,sans-serif;box-shadow:0 8px 32px rgba(0,0,0,.3);';
      const title = document.createElement('h2');
      title.id = 'remember-key-title';

      const para = document.createElement('p');
      para.style.cssText = 'margin:0 0 12px;font-size:13px;color:#9ca8ba;line-height:1.5;';
      para.textContent = 'The password was accepted. Save it on this machine so you can enter automatically next time?';
      const label = document.createElement('label');
      label.style.cssText = 'display:flex;align-items:center;gap:8px;font-size:13px;color:#e1e6ed;margin:8px 0 16px;cursor:pointer;';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = true;
      label.appendChild(cb);
      label.appendChild(document.createTextNode('Remember this password on this machine'));
      const actions = document.createElement('div');
      actions.style.cssText = 'display:flex;gap:8px;justify-content:flex-end;';
      const noBtn = document.createElement('button');
      noBtn.textContent = 'This session only';
      noBtn.style.cssText = 'padding:8px 14px;border-radius:8px;border:1px solid #2d3648;background:#1a1f2b;color:#e1e6ed;font-family:inherit;font-size:13px;cursor:pointer;';
      const yesBtn = document.createElement('button');
      yesBtn.textContent = 'Save & Continue';
      yesBtn.style.cssText = 'padding:8px 14px;border-radius:8px;border:none;background:linear-gradient(135deg,#6c8cff,#5b7ad0);color:#fff;font-weight:600;font-family:inherit;font-size:13px;cursor:pointer;';
      function done(remember) {
        overlay.remove();
        resolve(remember);
      }
      noBtn.addEventListener('click', function () { done(false); });
      yesBtn.addEventListener('click', function () { done(cb.checked); });
      actions.appendChild(noBtn);
      actions.appendChild(yesBtn);
      box.appendChild(title);
      box.appendChild(para);
      box.appendChild(label);
      box.appendChild(actions);
      overlay.appendChild(box);
      document.body.appendChild(overlay);
      yesBtn.focus();
    });
  }
  window.askRememberKey = askRememberKey;

  function setupFirstPassword() {
    if (sessionStorage.getItem('ride-setup-shown')) return;
    sessionStorage.setItem('ride-setup-shown', '1');
    const overlay = document.createElement('div');
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.setAttribute('aria-labelledby', 'setup-pw-title');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9500;';
    const box = document.createElement('div');
    box.style.cssText = 'background:#141820;border:1px solid #2d3648;border-radius:12px;padding:24px;max-width:440px;width:90%;color:#e1e6ed;font-family:Inter,system-ui,sans-serif;box-shadow:0 8px 32px rgba(0,0,0,.3);';
    const title = document.createElement('h2');
    title.id = 'setup-pw-title';
    title.textContent = 'Set Control-Plane Password';
    title.style.cssText = 'margin:0 0 8px;font-size:16px;color:#6c8cff;';
    const para = document.createElement('p');
    para.style.cssText = 'margin:0 0 12px;font-size:13px;color:#9ca8ba;line-height:1.5;';
    para.textContent = 'No password is configured. Set a control-plane password (minimum 8 characters) to secure administrative access. The one-time setup token guards this first-run window: it is printed in the server logs and stored in ridebase/setup-token.';

    // First-run is guarded by a one-time setup token: while no password exists the
    // endpoint has no credential to validate, so the token proves local/admin access.
    const tokenWrap = document.createElement('div');
    tokenWrap.style.cssText = 'margin:0 0 12px;';
    const tokenLabel = document.createElement('label');
    tokenLabel.textContent = 'Setup token';
    tokenLabel.style.cssText = 'display:block;margin:0 0 4px;font-size:12px;color:#9ca8ba;';
    const tokenInput = document.createElement('input');
    tokenInput.type = 'text';
    tokenInput.autocomplete = 'off';
    tokenInput.placeholder = 'First-run setup token (from the server logs)';
    tokenInput.setAttribute('aria-label', 'First-run setup token');
    tokenInput.style.cssText = 'width:100%;box-sizing:border-box;padding:8px 10px;border-radius:6px;border:1px solid #2d3648;background:#0f131a;color:#e1e6ed;font-family:ui-monospace,Menlo,Consolas,monospace;';
    tokenWrap.appendChild(tokenLabel);
    tokenWrap.appendChild(tokenInput);

    function createPasswordInput(placeholder, ariaLabel, marginBottom) {
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:relative;display:flex;align-items:center;margin:' + (marginBottom || '0') + ';';
      const input = document.createElement('input');
      input.type = 'password';
      input.placeholder = placeholder;
      input.setAttribute('aria-label', ariaLabel);
      input.style.cssText = 'width:100%;box-sizing:border-box;padding:10px 32px 10px 12px;border-radius:8px;border:1px solid #2d3648;background:#0e1116;color:#e1e6ed;font-family:inherit;font-size:14px;';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pw-toggle-btn';
      btn.setAttribute('aria-label', 'Show ' + ariaLabel.toLowerCase());
      btn.title = 'Show ' + ariaLabel.toLowerCase();
      btn.style.cssText = 'position:absolute;right:8px;background:none;border:none;color:#9ca8ba;cursor:pointer;padding:2px;display:flex;align-items:center;justify-content:center;border-radius:4px;';
      btn.innerHTML = '<svg class="icon-svg-sm" aria-hidden="true" viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
      btn.addEventListener('click', function () {
        const isPass = input.type === 'password';
        input.type = isPass ? 'text' : 'password';
        btn.setAttribute('aria-label', (isPass ? 'Hide ' : 'Show ') + ariaLabel.toLowerCase());
        btn.title = (isPass ? 'Hide ' : 'Show ') + ariaLabel.toLowerCase();
        btn.querySelector('svg').innerHTML = isPass

          : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      });
      wrap.appendChild(input);
      wrap.appendChild(btn);
      return { wrap: wrap, input: input };
    }
    const pwObj = createPasswordInput('New password', 'New password', '8px 0');
    const pw = pwObj.input;
    const pw2Obj = createPasswordInput('Confirm password', 'Confirm password', '0 0 16px');
    const pw2 = pw2Obj.input;
    const actions = document.createElement('div');
    actions.style.cssText = 'display:flex;gap:8px;justify-content:flex-end;';

    cancelBtn.textContent = 'Cancel';

      if (typeof showToast === 'function') showToast(msg, 'error');

      if (!pw.value) { err('Please enter a password'); pw.focus(); return; }

      saveBtn.textContent = 'Saving…';
      fetch('/api/auth/password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Setup-Token': tokenInput.value.trim() },
        body: JSON.stringify({ password: pw.value }),
      }).then(function (r) {
        if (!r.ok) return r.json().then(function (j) { throw new Error(j && j.error ? j.error : 'Server error'); });
        const key = pw.value.trim();
        apiKey = key;
        storeKey(key, true);
        overlay.remove();
        location.reload();
      }).catch(function (e) {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save';
        err('Failed to save password: ' + (e && e.message ? e.message : e));
      });
    });
    cancelBtn.addEventListener('click', function () { overlay.remove(); });
    actions.appendChild(cancelBtn);
    actions.appendChild(saveBtn);
    box.appendChild(title);
    box.appendChild(para);
    box.appendChild(pwObj.wrap);
    box.appendChild(pw2Obj.wrap);
    box.appendChild(tokenWrap);
    box.appendChild(actions);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    pw.focus();
  }

  const origFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    init = init || {};
    let url = input;
    if (typeof input === 'object' && input && typeof input.url === 'string') url = input.url;
    if (typeof url === 'string' && url.startsWith('/api/') && apiKey) {
      const headers = new Headers(init.headers || (input && input.headers) || {});
      if (!headers.has('X-API-Key')) headers.set('X-API-Key', apiKey);
      init.headers = headers;
    }
    return origFetch(input, init).then(function (resp) {
      const needSetup = resp.status === 503 && resp.headers.get('X-Auth-Setup') === 'required';
      if (needSetup && typeof setupFirstPassword === 'function') {
      setupFirstPassword();
      return resp;
      }
if (resp.status === 401 && !sessionStorage.getItem('ride-config-401')) {
        sessionStorage.setItem('ride-config-401', '1');
        const typed = window.prompt('Enter the control-plane password:');
        if (typed) {
          const key = typed.trim();
          apiKey = key;
          askRememberKey(key).then(function (remember) {
            storeKey(key, remember);
            location.reload();
          });
        }
      }
      return resp;
    });
  };
})();

function filterSidebar(query) {
  const q = (query || '').trim().toLowerCase();
  let matches = 0;
  document.querySelectorAll('#sidebar .sidebar-items .section-item').forEach(btn => {
    const sec = btn.dataset.section || '';
    const label = SECTION_LABELS[sec] || sec;
    const detail = SECTION_DETAILS[sec] || '';
    const isMatch = !q || sec.toLowerCase().includes(q) || label.toLowerCase().includes(q) || detail.toLowerCase().includes(q);
    btn.style.display = isMatch ? '' : 'none';
    if (isMatch) matches++;
  });
  const emptyEl = document.getElementById('sidebarEmpty');
  if (emptyEl) {
    emptyEl.style.display = (matches === 0 && q) ? 'block' : 'none';
  }
}

  const searchInput = searchWrap.querySelector('input');

  keys.forEach(key => {

      <div class="section-item-main">

          <span class="section-item-key">${escapeHtml(key)}</span>
        </span>

    btn.addEventListener('click', () => selectSection(key));

  });

  const emptyMsg = document.createElement('div');
  emptyMsg.id = 'sidebarEmpty';
  emptyMsg.className = 'sidebar-empty';

  sidebar.appendChild(itemsContainer);

  // Advanced / Developer Tools
  const divider = document.createElement('div');
  divider.className = 'sidebar-divider';
  sidebar.appendChild(divider);

  const footerLabel = document.createElement('div');
  footerLabel.className = 'sidebar-label sidebar-footer-label';
  footerLabel.textContent = 'Advanced';
  sidebar.appendChild(footerLabel);

  const raw = document.createElement('button');
  raw.className = 'section-item';
  raw.dataset.section = '__raw__';
  raw.setAttribute('role', 'tab');
  raw.title = 'Full configuration as raw JSON';
  raw.innerHTML = `
    <div class="section-item-main">
      <span class="section-item-icon" aria-hidden="true">${SECTION_ICONS.__raw__}</span>
      <span class="section-item-text">
        <span class="section-item-name">Raw</span>
        <span class="section-item-key">JSON / YAML</span>
      </span>
    </div>
    <span class="count"></span>`;
  raw.addEventListener('click', () => selectSection('__raw__'));
  sidebar.appendChild(raw);
}

// ── LLM Decipher section (editable; persistence via the LLM settings API) ───
// The LLM page and this section are two entry points onto the SAME data: the
// fields are populated from the effective (runtime) settings and saved through
// /api/llm/settings (see saveConfig), never through PUT /api/config. The
// working copy lives in cfg.llm_decipher so the generic renderer's edits land
// there. No refetch on re-render, or structural edits would discard unsaved
// changes.
let llmSectionLoaded = false;
async function renderLLMSection(container) {
  const banner = document.createElement('div');
  banner.className = 'field-group llm-banner-card';
  banner.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px;padding:14px 18px;background:color-mix(in srgb, var(--surface2) 60%, var(--surface));border:1px solid var(--border);border-radius:10px;';

  const bannerText = document.createElement('div');
  bannerText.style.cssText = 'flex:1;min-width:240px;';
  const bannerTitle = document.createElement('div');
  bannerTitle.style.cssText = 'font-weight:700;font-size:14px;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:8px;';
  bannerTitle.innerHTML = '<svg class="sec-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8.01" y2="16"/><line x1="16" y1="16" x2="16.01" y2="16"/></svg><span>Dedicated LLM Service Manager</span>';
  const bannerDesc = document.createElement('div');
  bannerDesc.className = 'sec-desc';
  bannerDesc.style.cssText = 'margin-bottom:0;font-size:12.5px;line-height:1.45;';
  bannerDesc.textContent = 'Profiles configured here are applied through the LLM settings API — the same service store the LLM page uses.';
  bannerText.appendChild(bannerTitle);
  bannerText.appendChild(bannerDesc);
  banner.appendChild(bannerText);

  const openBtn = document.createElement('button');
  openBtn.type = 'button';
  openBtn.className = 'btn btn-primary btn-open-llm';
  openBtn.style.cssText = 'min-height:42px;padding:8px 16px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:8px;border-radius:8px;';
  openBtn.innerHTML = '<span>Open LLM Settings</span><span class="btn-glow-pill" aria-hidden="true">↗</span>';
  openBtn.setAttribute('aria-label', 'Open the LLM settings page');
  openBtn.addEventListener('click', () => { window.location.href = '/#llm-settings'; });
  banner.appendChild(openBtn);

  container.appendChild(banner);

  const box = document.createElement('div');
  container.appendChild(box);
  if (!llmSectionLoaded) {
    box.textContent = 'Loading…';
    try {
      const res = await fetch('/api/llm/settings');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      // The renderer edits write through cfg, so the working copy must hold the
      // effective settings — not the stale config.yaml section.
      cfg.llm_decipher = await res.json();
      llmSectionLoaded = true;
    } catch (err) {
      box.textContent = 'Could not load LLM settings: ' + err.message;
      return;
    }
  }
  box.innerHTML = '';
  renderObject(box, cfg.llm_decipher, 'llm_decipher');
}

function selectSection(key) {
  document.querySelectorAll('.section-item').forEach(b => {
    const isActive = b.dataset.section === key;
    b.classList.toggle('active', isActive);
    if (isActive) {
      b.setAttribute('aria-current', 'true');
      b.setAttribute('aria-selected', 'true');
    } else {
      b.removeAttribute('aria-current');
      b.setAttribute('aria-selected', 'false');
    }
  });
  const title = document.getElementById('sectionTitle');
  const desc = document.getElementById('sectionDesc');
  const fields = document.getElementById('fields');
  if (title) {
    title.setAttribute('tabindex', '-1');
  }
  if (key === '__raw__') {
    title.textContent = 'Raw Configuration';
    desc.innerHTML = '<span>Full config as JSON — edit carefully, validated on save.</span>';
    const fmtBtn = document.createElement('button');
    fmtBtn.type = 'button';
    fmtBtn.className = 'btn btn-ghost';
    fmtBtn.style.cssText = 'margin-left:12px;padding:3px 10px;font-size:12px;';
    fmtBtn.textContent = 'Format JSON';
    fmtBtn.setAttribute('aria-label', 'Format Raw Configuration JSON');

    const ta = document.createElement('textarea');
    ta.id = 'raw-editor';
    ta.setAttribute('aria-label', 'Raw configuration JSON');
    ta.style.cssText = 'width:100%;min-height:60vh;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:ui-monospace,monospace;font-size:12px;resize:vertical;';
    ta.value = JSON.stringify(cfg, null, 2);
    ta.addEventListener('input', () => { fields.classList.add('dirty'); setDirty('__raw__'); });

    fmtBtn.addEventListener('click', () => {
      try {
        const parsed = JSON.parse(ta.value);
        ta.value = JSON.stringify(parsed, null, 2);
        fields.classList.add('dirty');
        setDirty('__raw__');
        showToast('JSON formatted', 'success');
      } catch (err) {
        showToast('Invalid JSON in Raw Configuration: ' + err.message, 'error');
      }
    });

    desc.appendChild(fmtBtn);
    fields.innerHTML = '';
    fields.appendChild(ta);
    setDirty('__raw__');
    if (title) title.focus();
    return;
  }
  if (key === 'llm_decipher') {
    // Editable here too, but persistence belongs to the LLM settings API:
    // values are loaded from the effective (runtime) state and saved through
    // /api/llm/settings, never written to config.yaml by this page.
    title.textContent = SECTION_LABELS[key] || 'LLM Decipher';
    desc.textContent = 'LLM profiles in use — saved through the LLM settings API';
    fields.innerHTML = '';
    fields.classList.remove('dirty');
    renderLLMSection(fields);
    if (title) title.focus();
    return;
  }
  title.textContent = key;
  desc.textContent = HINTS[key] || 'Configuration section';
  fields.innerHTML = '';
  renderObject(fields, cfg[key], key);
  fields.classList.remove('dirty');
  // re-mark dirty fields visually
  dirty.forEach(p => {
    document.querySelectorAll(`[data-path="${p}"]`).forEach(el => el.classList.add('dirty'));
  });
  if (title) title.focus();
}

// ── Generic field renderer ──────────────────────────────────────────────────
function isSimpleType(v) {
  return ['string', 'number', 'boolean'].includes(typeof v) || v === null;
}

// Known enum fields → rendered as dropdowns instead of free text.
// Paths may contain '*' to match any single segment (e.g. array indices).
const ENUM_FIELDS = {
  'learning.default_mode': ['learning', 'production', 'hybrid'],
  'buffer.backend': ['disk', 'memory'],
  'observability.logging.format': ['json', 'text'],
  'observability.logging.output': ['stdout', 'file'],
  'correlation.http.method': ['connection', 'header', 'body_hash'],
  'correlation.mqtt.method': ['topic_sequence', 'packet_id'],
  'correlation.coap.method': ['message_id', 'token'],
  'tls_decrypt.min_tls_version': ['TLSv1.0', 'TLSv1.1', 'TLSv1.2', 'TLSv1.3'],
  'tls_decrypt.max_tls_version': ['TLSv1.0', 'TLSv1.1', 'TLSv1.2', 'TLSv1.3'],
  'control.policy.default_policy': ['pid_thermal', 'rule_based'],
  'core.ip_profiles.*.connection': ['auto', 'tls', 'http', 'mqtt', 'coap', 'modbus'],
  'modification.rules.*.action': ['modify', 'block', 'inject', 'replace', 'redirect', 'delay'],
  'modification.rules.*.direction': ['request', 'response', 'both'],
  'modification.rules.*.match_type': ['hostname', 'path', 'header', 'body', 'method'],
  'traffic_selection.default_action': ['intercept', 'passthrough'],
  'traffic_selection.rules.*.action': ['intercept', 'passthrough'],
  'traffic_selection.rules.*.match_type': ['cidr', 'hostname', 'vendor', 'device_id'],
  'traffic_selection.rules.*.scope': ['local', 'external'],
  'tls_decrypt.pinning_bypass.*.strategy': ['mitm_proxy', 'frida', 'disable_pin_check'],
  'protocol_servers.zwave_bridge.connection_type': ['mqtt', 'ws'],
};

function enumOptionsFor(path) {
  for (const [pattern, options] of Object.entries(ENUM_FIELDS)) {
    const pat = pattern.split('.');
    const seg = path.split('.');
    if (pat.length !== seg.length) continue;
    let match = true;
    for (let i = 0; i < pat.length; i++) {
      if (pat[i] !== '*' && pat[i] !== seg[i]) { match = false; break; }
    }
    if (match) return options;
  }
  return null;
}

let fieldCounter = 0;

function renderObject(container, obj, path) {
  const entries = Object.entries(obj || {});
  if (entries.length === 0) {
    const p = document.createElement('p');
    p.className = 'sec-desc';
    p.textContent = '(empty)';
    container.appendChild(p);
    // Allow populating empty dicts (e.g. core.ip_profiles, vendors, profiles)
    const addBtn = document.createElement('button');
    addBtn.className = 'btn btn-ghost';
    addBtn.textContent = '+ Add key';
    addBtn.style.cssText = 'margin-top:6px;font-size:12px;padding:4px 12px;';
    addBtn.addEventListener('click', () => {
      const key = prompt('New key name:');
      if (!key) return;
      const parent = getAt(cfg, path);
      parent[key] = '';
      setDirty(path);
      rerenderSection();
    });
    container.appendChild(addBtn);
    return;
  }
  entries.forEach(([k, v]) => {
    const childPath = path ? path + '.' + k : k;
    if (isSimpleType(v)) {
      container.appendChild(renderField(childPath, k, v));
    } else if (Array.isArray(v)) {
      container.appendChild(renderArray(childPath, k, v));
    } else {
      // nested object → collapsible group
      const group = document.createElement('div');
      group.className = 'field-group';
      group.dataset.path = childPath;
      const head = document.createElement('div');
      head.className = 'field-group-title';
      head.dataset.path = childPath;
      head.setAttribute('role', 'button');
      head.setAttribute('tabindex', '0');
      head.setAttribute('aria-expanded', 'true');
      const bodyId = 'fg-body-' + (fieldCounter++);
      head.setAttribute('aria-controls', bodyId);
      
      const leftDiv = document.createElement('div');
      leftDiv.className = 'field-group-title-left';
      const chevronSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      chevronSvg.setAttribute('class', 'chev-svg');
      chevronSvg.setAttribute('aria-hidden', 'true');
      chevronSvg.setAttribute('viewBox', '0 0 24 24');
      chevronSvg.innerHTML = '<polyline points="6 9 12 15 18 9"/>';
      const nameSpan = document.createElement('span');
      nameSpan.textContent = k;
      leftDiv.appendChild(chevronSvg);
      leftDiv.appendChild(nameSpan);
      head.appendChild(leftDiv);

      const body = document.createElement('div');
      body.id = bodyId;
      renderObject(body, v, childPath);

      const toggleGroup = () => {
        const hidden = body.style.display === 'none';
        body.style.display = hidden ? '' : 'none';
        chevronSvg.classList.toggle('collapsed', hidden);
        head.setAttribute('aria-expanded', hidden ? 'true' : 'false');
      };
      head.addEventListener('click', toggleGroup);
      head.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggleGroup();
        }
      });
      group.appendChild(head);
      group.appendChild(body);
      container.appendChild(group);
    }
  });
}

// Re-render the currently active section (used after structural edits like
// adding/removing array items or dict keys).
function rerenderSection() {
  const active = document.querySelector('.section-item.active');
  if (active) selectSection(active.dataset.section);
}

function renderField(path, label, value) {
  const row = document.createElement('div');
  row.className = 'field';
  row.dataset.path = path;
  const id = 'f-' + (fieldCounter++);
  const info = document.createElement('div');
  info.className = 'f-info';
  info.innerHTML = `<label for="${id}" class="f-name">${escapeHtml(label)}</label><div class="f-desc">${escapeHtml(path)}</div>`;
  row.appendChild(info);
  const ctrl = document.createElement('div');
  ctrl.className = 'f-control';

  if (typeof value === 'boolean') {
    row.classList.add('field-switch');
    const switchWrap = document.createElement('label');
    switchWrap.className = 'switch-wrap';
    switchWrap.htmlFor = id;
    const input = document.createElement('input');
    input.type = 'checkbox'; input.className = 'switch';
    input.role = 'switch';
    input.id = id; input.checked = value;
    input.setAttribute('aria-checked', value ? 'true' : 'false');
    input.setAttribute('aria-label', label);
    input.addEventListener('change', () => {
      input.setAttribute('aria-checked', input.checked ? 'true' : 'false');
      setAt(cfg, path, input.checked);
      setDirty(path);
      markFieldDirty(path);
    });
    switchWrap.appendChild(input);
    ctrl.appendChild(switchWrap);
  } else if (typeof value === 'number') {
    const input = document.createElement('input');
    input.type = 'number'; input.id = id; input.value = value;
    input.step = 'any';
    input.addEventListener('change', () => {
      const n = parseFloat(input.value);
      setAt(cfg, path, Number.isNaN(n) ? null : n);
      setDirty(path); markFieldDirty(path);
    });
    ctrl.appendChild(input);
  } else if (value === null) {
    const input = document.createElement('input');
    input.type = 'text'; input.id = id; input.value = '';
    input.placeholder = 'null';
    input.addEventListener('change', () => {
      setAt(cfg, path, input.value === '' ? null : input.value);
      setDirty(path); markFieldDirty(path);
    });
    ctrl.appendChild(input);
  } else if (typeof value === 'string') {
    const enumOpts = enumOptionsFor(path);
    if (enumOpts) {
      const select = document.createElement('select');
      select.id = id;
      enumOpts.forEach(opt => {
        const o = document.createElement('option');
        o.value = opt; o.textContent = opt;
        if (opt === value) o.selected = true;
        select.appendChild(o);
      });
      select.addEventListener('change', () => {
        setAt(cfg, path, select.value);
        setDirty(path); markFieldDirty(path);
      });
      ctrl.appendChild(select);
    } else {
      const isLong = typeof value === 'string' && value.length > 80;
      if (isLong) {
        const ta = document.createElement('textarea');
        ta.id = id; ta.value = value; ta.rows = 4;
        ta.addEventListener('input', () => {
          setAt(cfg, path, ta.value);
          setDirty(path); markFieldDirty(path);
        });
        ctrl.appendChild(ta);
      } else {
        // Secret fields arrive masked from the API; render them as password
        // inputs. Leaving the mask unchanged keeps the stored value on save.
        const isPassword = /(^|\.)(api_key|password|mqtt_pass)$/.test(path);
        if (isPassword) {
          const wrap = document.createElement('div');
          wrap.className = 'pw-wrap';
          const input = document.createElement('input');
          input.type = 'password';
          input.autocomplete = 'off';
          input.id = id;
          input.value = value;
          input.style.paddingRight = '42px';
          input.addEventListener('change', () => {
            setAt(cfg, path, input.value === '' ? null : input.value);
            setDirty(path); markFieldDirty(path);
          });
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'pw-toggle-btn';
          btn.setAttribute('aria-label', 'Show API key');
          btn.title = 'Show API key';
          btn.innerHTML = '<svg class="icon-svg-sm" aria-hidden="true" viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
          btn.addEventListener('click', () => {
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            btn.setAttribute('aria-label', show ? 'Hide API key' : 'Show API key');
            btn.title = show ? 'Hide API key' : 'Show API key';
            const svg = btn.querySelector('svg');
            if (svg) {
              svg.innerHTML = show
                ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
                : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
            }
          });
          wrap.appendChild(input);
          wrap.appendChild(btn);
          ctrl.appendChild(wrap);
        } else {
          const input = document.createElement('input');
          input.type = 'text';
          input.id = id; input.value = value;
          input.addEventListener('change', () => {
            setAt(cfg, path, input.value === '' ? null : input.value);
            setDirty(path); markFieldDirty(path);
          });
          ctrl.appendChild(input);
        }
      }
    }
  }

  row.appendChild(ctrl);
  return row;
}

function renderArray(path, label, arr) {
  const group = document.createElement('div');
  group.className = 'field-group';
  group.dataset.path = path;
  const head = document.createElement('div');
  head.className = 'field-group-title';
  head.setAttribute('role', 'button');
  head.setAttribute('tabindex', '0');
  head.setAttribute('aria-expanded', 'true');
  const bodyId = 'fg-body-' + (fieldCounter++);
  head.setAttribute('aria-controls', bodyId);

  const leftDiv = document.createElement('div');
  leftDiv.className = 'field-group-title-left';
  const chevronSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  chevronSvg.setAttribute('class', 'chev-svg');
  chevronSvg.setAttribute('aria-hidden', 'true');
  chevronSvg.setAttribute('viewBox', '0 0 24 24');
  chevronSvg.innerHTML = '<polyline points="6 9 12 15 18 9"/>';
  const nameSpan = document.createElement('span');
  nameSpan.textContent = label + ' (' + arr.length + ')';
  leftDiv.appendChild(chevronSvg);
  leftDiv.appendChild(nameSpan);
  head.appendChild(leftDiv);

  const body = document.createElement('div');
  body.id = bodyId;
  const toggleArrayGroup = () => {
    const hidden = body.style.display === 'none';
    body.style.display = hidden ? '' : 'none';
    chevronSvg.classList.toggle('collapsed', hidden);
    head.setAttribute('aria-expanded', hidden ? 'true' : 'false');
  };
  head.addEventListener('click', toggleArrayGroup);
  head.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      toggleArrayGroup();
    }
  });
  group.appendChild(head);
  group.appendChild(body);
  // Primitive arrays → editable comma-separated list
  if (arr.length && arr.every(isSimpleType)) {
    const row = document.createElement('div');
    row.className = 'field';
    const id = 'f-' + (fieldCounter++);
    const info = document.createElement('div');
    info.className = 'f-info';
    info.innerHTML = `<label for="${id}" class="f-name">${escapeHtml(label)}</label><div class="f-desc">${escapeHtml(path)} — comma-separated values</div>`;
    row.appendChild(info);
    const ctrl = document.createElement('div');
    ctrl.className = 'f-control';
    const input = document.createElement('input');
    input.type = 'text';
    input.id = id;
    input.value = arr.join(', ');
    input.setAttribute('aria-label', label);
    input.addEventListener('change', () => {
      const parts = input.value.split(',').map(s => s.trim()).filter(s => s !== '');
      const isNum = arr.every(v => typeof v === 'number');
      setAt(cfg, path, isNum ? parts.map(Number) : parts);
      setDirty(path);
      markFieldDirty(path);
    });
    ctrl.appendChild(input);
    row.appendChild(ctrl);
    body.appendChild(row);
  } else {
    // Object array (or empty array) → render each item with add/remove controls
    if (arr.length === 0) {
      const p = document.createElement('p');
      p.className = 'sec-desc';
      p.textContent = '(empty)';
      body.appendChild(p);
    } else {
      arr.forEach((item, idx) => {
        const itemPath = path + '.' + idx;
        const itemGroup = document.createElement('div');
        itemGroup.className = 'field-group';
        itemGroup.dataset.path = itemPath;
        const itemHead = document.createElement('div');
        itemHead.className = 'field-group-title';
        itemHead.setAttribute('role', 'button');
        itemHead.setAttribute('tabindex', '0');
        itemHead.setAttribute('aria-expanded', 'true');
        const itemBodyId = 'fg-body-' + (fieldCounter++);
        itemHead.setAttribute('aria-controls', itemBodyId);

        const itemLeftDiv = document.createElement('div');
        itemLeftDiv.className = 'field-group-title-left';
        const itemChevronSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        itemChevronSvg.setAttribute('class', 'chev-svg');
        itemChevronSvg.setAttribute('aria-hidden', 'true');
        itemChevronSvg.setAttribute('viewBox', '0 0 24 24');
        itemChevronSvg.innerHTML = '<polyline points="6 9 12 15 18 9"/>';
        const itemName = document.createElement('span');
        itemName.textContent = '#' + idx;
        itemLeftDiv.appendChild(itemChevronSvg);
        itemLeftDiv.appendChild(itemName);
        itemHead.appendChild(itemLeftDiv);

        const itemBody = document.createElement('div');
        itemBody.id = itemBodyId;
        renderObject(itemBody, item, itemPath);
        const toggleItem = () => {
          const hidden = itemBody.style.display === 'none';
          itemBody.style.display = hidden ? '' : 'none';
          itemChevronSvg.classList.toggle('collapsed', hidden);
          itemHead.setAttribute('aria-expanded', hidden ? 'true' : 'false');
        };
        itemHead.addEventListener('click', toggleItem);
        itemHead.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggleItem();
          }
        });
        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'btn btn-ghost btn-remove';
        removeBtn.textContent = 'Remove';
        removeBtn.setAttribute('aria-label', 'Remove item #' + idx);
        removeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const parent = getAt(cfg, path);
          parent.splice(idx, 1);
          setDirty(path);
          rerenderSection();
        });
        itemHead.appendChild(removeBtn);
        itemGroup.appendChild(itemHead);
        itemGroup.appendChild(itemBody);
        body.appendChild(itemGroup);
      });
    }
    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'btn btn-ghost';
    addBtn.textContent = '+ Add item';
    addBtn.style.cssText = 'margin-top:10px;font-size:13px;padding:8px 16px;min-height:38px;';
    addBtn.addEventListener('click', () => {
      const parent = getAt(cfg, path);
      parent.push({});
      setDirty(path);
      rerenderSection();
    });
    body.appendChild(addBtn);
  }
  return group;
}

// Path helpers — mirrors how we write values back
function getAt(obj, path) {
  if (!path) return obj;
  return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj);
}
function setAt(obj, path, value) {
  const parts = path.split('.');
  const last = parts.pop();
  const parent = parts.reduce((o, k) => (o[k] == null ? (o[k] = {}) : o[k]), obj);
  parent[last] = value;
}

// Collect the edited section tree from the DOM (only the currently rendered section)
function collectSection(key) {
  if (key === '__raw__') {
    const ta = document.getElementById('raw-editor');
    if (!ta) return cfg;
    try { return JSON.parse(ta.value); } catch (e) { return null; }
  }
  return cfg[key];
}

function setDirty(path) { dirty.add(path); updateSaveBtn(); }
function markFieldDirty(path) {
  const el = document.querySelector(`[data-path="${path}"]`);
  if (el) el.classList.add('dirty');
  // also mark parent section title
}
function updateSaveBtn() {
  const has = dirty.size > 0;
  const saveBtn = document.getElementById('saveBtn');
  const saveBtn2 = document.getElementById('saveBtn2');
  if (saveBtn) {
    saveBtn.disabled = !has;
    saveBtn.title = has ? 'Save configuration changes (Ctrl+S)' : 'No unsaved changes (Ctrl+S)';
  }
  if (saveBtn2) {
    saveBtn2.disabled = !has;
    saveBtn2.title = has ? 'Save configuration changes (Ctrl+S)' : 'No unsaved changes (Ctrl+S)';
  }

  document.querySelectorAll('.section-item[data-section]').forEach(btn => {
    const sec = btn.dataset.section;
    let isDirty = false;
    let secDirtyCount = 0;
    if (sec === '__raw__') {
      isDirty = dirty.has('__raw__');
    } else {
      secDirtyCount = [...dirty].filter(p => p === sec || p.startsWith(sec + '.')).length;
      isDirty = secDirtyCount > 0;
    }
    btn.classList.toggle('dirty-section', isDirty);
    const countEl = btn.querySelector('.count');
    if (countEl) {
      countEl.style.display = '';
      if (sec === '__raw__') {
        countEl.textContent = isDirty ? '●' : '';
        countEl.title = isDirty ? 'Has unsaved changes' : '';
      } else {
        countEl.textContent = isDirty ? `● ${secDirtyCount}` : '';
        countEl.title = isDirty ? `${secDirtyCount} unsaved change${secDirtyCount > 1 ? 's' : ''}` : '';
      }
    }
  });
}

// ── Load & save ─────────────────────────────────────────────────────────────
async function loadConfig() {
  try {
    const res = await fetch('/api/config');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    cfg = data.config || {};
    document.getElementById('configPath').textContent = 'config/config.yaml';
    buildSidebar();
    selectSection(Object.keys(cfg)[0] || 'core');
  } catch (e) {
    document.getElementById('sectionTitle').textContent = 'Error loading config';
    document.getElementById('sectionDesc').textContent = String(e.message || e);
  }
}

async function saveConfig() {
  const btn = document.getElementById('saveBtn');
  const btn2 = document.getElementById('saveBtn2');
  const status = document.getElementById('saveStatus');
  btn.disabled = true;
  btn2.disabled = true;
  status.textContent = 'Saving…';
  status.className = 'status';
  // First collect current section tree into cfg
  const activeSection = document.querySelector('.section-item.active');
  const key = activeSection ? activeSection.dataset.section : Object.keys(cfg)[0];
  if (key === '__raw__') {
    const parsed = collectSection('__raw__');
    if (parsed === null) {
      status.textContent = 'Invalid JSON — not saved';
      status.className = 'status err';
      updateSaveBtn();
      return;
    }
    cfg = parsed;
    }
    // For normal sections cfg already reflects every edit: field changes write
    // straight into cfg, so edits in any section are preserved across switches.
  try {
    // LLM profiles are persisted by the LLM settings API, not by /api/config:
    // this page is a second entry point onto the same store.
    const llmTouched = [...dirty].some(p => p === 'llm_decipher' || p.startsWith('llm_decipher.'));
    if (llmTouched && cfg.llm_decipher) {
      const lres = await fetch('/api/llm/settings', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(cfg.llm_decipher),
      });
      if (!lres.ok) {
        const lerr = await lres.json().catch(() => null);
        const lmsg = (lerr && lerr.error) ? lerr.error : 'HTTP ' + lres.status;
        status.textContent = 'LLM profiles not saved: ' + lmsg;
        status.className = 'status err';
        showToast('LLM profiles not saved', 'error');
        updateSaveBtn();
        return;
      }
      // Drop the cached working copy so the next visit re-reads the
      // canonical (validated) settings.
      llmSectionLoaded = false;
    }
    const res = await fetch('/api/config', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ config: cfg }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => null);
      const msg = (err && err.error) ? err.error : 'HTTP ' + res.status;
      status.textContent = msg;
      status.className = 'status err';
      showToast('Save failed', 'error');
      updateSaveBtn();
      return;
    }
    // Reload canonical config from server (validated/dumped)
    const savedRes = await fetch('/api/config');
    const savedData = await savedRes.json();
    cfg = savedData.config || cfg;
    dirty.clear();
    llmSectionLoaded = false;
    updateSaveBtn();
    status.textContent = 'Saved, hot-reload applied.';
    status.className = 'status ok';
    showToast('Configuration saved', 'success');
    // Rebuild current view from canonical config
    selectSection(key);
  } catch (e) {
    status.textContent = String(e.message || e);
    status.className = 'status err';
    showToast('Save failed', 'error');
    updateSaveBtn();
  }
}

// (Software update moved to the Options page at /options)

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

window.addEventListener('beforeunload', (event) => {
  if (dirty.size > 0) {
    event.preventDefault();
    event.returnValue = '';
  }
});

document.addEventListener('keydown', (event) => {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {
    event.preventDefault();
    if (dirty.size > 0) {
      saveConfig();
    } else {
      showToast('No unsaved changes', 'info');
    }
  }
});

loadConfig();
</script>
