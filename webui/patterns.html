<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Patterns — Ride the API</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  // Apply persisted theme as early as possible to avoid a flash of colour.
  (function () {
    try {
      var t = localStorage.getItem('rta-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0e14; --surface: #141820; --surface2: #1a1f2b; --border: #2d3648;
    --text: #e1e6ed; --text2: #9ca8ba; --accent: #6c8cff; --accent2: #5b7ad0;
    --green: #34d399; --yellow: #fbbf24; --red: #f87171; --blue: #60a5fa;
    --radius: 12px; --shadow: 0 8px 32px rgba(0,0,0,.3);
  }
  [data-theme="light"] {
    --bg: #f4f6fb; --surface: #ffffff; --surface2: #eef1f7; --border: #d2dae8;
    --text: #1b2233; --text2: #5a6577; --accent: #4a63e0; --accent2: #3f55c2;
    --green: #16a34a; --yellow: #d97706; --red: #dc2626; --blue: #2563eb;
    --radius: 12px; --shadow: 0 8px 32px rgba(20,30,60,.12);
  }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 24px; min-height:100vh; }
  a { color: inherit; text-decoration: none; }
  .skip-link {
    position: absolute; top: -100%; left: 8px; padding: 8px 16px;
    background: var(--accent); color: #fff; border-radius: 0 0 8px 8px;
    font-size: 14px; font-weight: 600; z-index: 9999; text-decoration: none;
  }
  .skip-link:focus { top: 0; }
  .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .btn { padding:8px 14px; border-radius:8px; border:none; cursor:pointer; font-weight:600; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-ghost { background:var(--surface2); border:1px solid var(--border); color:var(--text); }
  .btn-primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; }
  .btn-danger { background:var(--red); color:#fff; }
  .btn-danger:hover { opacity:.85; }
  .btn-danger:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .container { max-width:1100px; margin:0 auto; }
  .cards { display:grid; gap:12px; }
  .pattern-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; }
  .pc-header { display:flex; justify-content:space-between; align-items:center; gap:12px; cursor:pointer; }
  .pc-header:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .pc-title { font-weight:700; font-size:14px; color:var(--accent); }
  .badge { padding:4px 8px; border-radius:10px; font-weight:700; font-size:12px; }
  .badge-low { background:rgba(96,165,250,.08); color:var(--blue); border:1px solid rgba(96,165,250,.16); }
  .pc-body { margin-top:12px; border-top:1px solid rgba(255,255,255,.02); padding-top:12px; display:none; }
  .row { display:flex; gap:12px; margin-bottom:8px; }
  .col { flex:1; }
  label { display:block; font-size:13px; color:var(--text2); margin-bottom:6px; }
  input[type=text], input[type=number], select, textarea { width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:8px; border-radius:6px; font-family:inherit; }
  textarea { min-height:100px; font-family:monospace; font-size:13px; }
  .tags { display:flex; gap:8px; flex-wrap:wrap; padding:6px 0; }
  .tag { background:var(--surface2); border:1px solid var(--border); padding:6px 8px; border-radius:999px; font-size:13px; display:inline-flex; gap:8px; align-items:center; }
  .tag button { background:none;border:none;color:var(--text2);cursor:pointer;padding:0; }
  .fm-list { margin-top:8px; }
  .fm-item { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .fm-item input, .fm-item select { width:auto; min-width:120px; }
  .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
  .toast-container { position:fixed; top:20px; right:20px; z-index:1000; display:flex; flex-direction:column; gap:8px; }
  .toast { padding:10px 14px; border-radius:8px; background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; gap:8px; font-size:13px; font-weight:500; max-width:360px; }
  .toast.success { border-color: var(--green); }
  .toast.error { border-color: var(--red); }
  .toast.warning { border-color: var(--yellow); }
  .toast.info { border-color: var(--blue); }
  .toast-icon { font-weight: 700; font-size: 14px; flex-shrink: 0; }
  .toast.success .toast-icon { color: var(--green); }
  .toast.error .toast-icon { color: var(--red); }
  .toast.warning .toast-icon { color: var(--yellow); }
  .toast.info .toast-icon { color: var(--blue); }
  .pattern-filter-bar { margin-bottom: 16px; position: relative; display: flex; align-items: center; max-width: 480px; }
  .pattern-filter-bar input {
    width: 100%; padding: 8px 32px 8px 34px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: inherit; font-size: 13px; transition: border-color .2s;
  }
  .pattern-filter-bar input:focus { outline: none; border-color: var(--accent); }
  .pattern-filter-bar input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pattern-filter-bar input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .pattern-filter-bar .search-icon {
    position: absolute; left: 10px; color: var(--text2); pointer-events: none; width: 16px; height: 16px;
    fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .pattern-filter-bar .search-kbd {
    position: absolute; right: 10px; pointer-events: none;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 4px;
    color: var(--text2); font-family: inherit; font-size: 11px; font-weight: 600;
    padding: 1px 6px; line-height: 1.4; transition: opacity .2s;
  }
  .pattern-filter-bar input:focus ~ .search-kbd,
  .pattern-filter-bar input:not(:placeholder-shown) ~ .search-kbd {
    opacity: 0;
  }
  .pattern-filter-bar .clear-search-btn {
    position: absolute; right: 10px; background: none; border: none; color: var(--text2);
    font-size: 16px; cursor: pointer; padding: 2px 6px; border-radius: 4px; line-height: 1;
    transition: color .2s; display: none;
  }
  .pattern-filter-bar .clear-search-btn:hover { color: var(--text); }
  .pattern-filter-bar .clear-search-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .empty { text-align: center; color: var(--text2); padding: 40px 20px; font-size: 14px; grid-column: 1 / -1; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  @media (min-width:720px) { .cards { grid-template-columns: 1fr; } }
</style>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <div class="container">
    <div class="header">
      <div>
              <div style="display:flex;align-items:center;gap:10px;">
                <img src="/static/logo.png" alt="ride-the-api logo" width="32" height="32" style="border-radius:6px;">
                <h1 style="font-size:20px;color:var(--accent);">Patterns</h1>
              </div>
              <div id="patternsSubtitle" style="color:var(--text2);font-size:13px;">Edit request/response patterns for device</div>
              <nav class="primary-nav" aria-label="Primary navigation">
                <a href="/">Dashboard</a>
                <a href="/patterns" aria-current="page">Patterns</a>
                <a href="/config">Configuration</a>
                <a href="/#llm-settings">LLM Settings</a>
                <a href="/options">Options</a>
              </nav>
            </div>
      <div>
              <button class="btn btn-primary" id="newPatternBtn" aria-label="Create a new pattern" title="Create a new pattern">+ New Pattern</button>
            </div>
    </div>

    <div class="pattern-filter-bar">
      <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="patternSearchInput" placeholder="Filter patterns by method, path, intent..." aria-label="Filter patterns" oninput="filterPatterns()" onkeydown="if(event.key==='Escape'){clearPatternSearch();event.stopPropagation();}">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
      <button type="button" class="clear-search-btn" id="clearPatternSearchBtn" aria-label="Clear pattern search filter" onclick="clearPatternSearch()">&times;</button>
      <span class="sr-only" id="patternFilterStatus" aria-live="polite"></span>
    </div>

    <main id="main-content">
      <div id="cards" class="cards">
        <div class="empty">Loading patterns…</div>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toasts" role="status" aria-live="polite" aria-atomic="true"></div>

<script src="/static/js/common.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/patterns.js"></script>
</body>
</html>
