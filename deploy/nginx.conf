# ═══════════════════════════════════════════════════════════════════════════════
# nginx reverse proxy for Ride-the-API
#
# Serves as the stable entry point for device traffic. It:
#   1. Terminates TLS (SSL termination) for the device cloud hostnames.
#   2. Routes requests to Ride-the-API (port 8911) for local pattern matching.
#   3. When Ride-the-API signals "forward" (X-Action: forward), routes the
#      request to the real vendor cloud via a DEDICATED dual-stack resolver
#      (8.8.8.8 primary, 1.1.1.1 fallback, IPv6 enabled) — bypassing the
#      local DNS (dnsmasq / Pi-hole / AdGuard Home) to prevent forwarding
#      loops (AdGuard → proxy → AdGuard → ... → cloud).
# ═══════════════════════════════════════════════════════════════════════════════

# Upstream: the Ride-the-API FastAPI app (internal network / sidecar)
upstream ride_api {
    server ride-the-api:8911;
}

# Upstream: the REAL vendor cloud, resolved via public DNS to avoid loops.
# resolver 8.8.8.8 1.1.1.1 ipv6=on;  → Google primary, Cloudflare fallback,
#                                       resolves both A and AAAA records.
upstream cloud_upstream {
    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=on;
    server api.example.com:443;
}

# ── HTTP server (redirects to HTTPS) ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Expose health / dashboard of the underlying proxy
    location /health {
        proxy_pass http://ride_api;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server (device traffic interception) ────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name *.example.com;

    # TLS termination certificates (device-trusted CA)
    ssl_certificate     /etc/nginx/certs/ride-api.pem;
    ssl_certificate_key /etc/nginx/certs/ride-api.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Limit request size (matches proxy.max_request_size)
    client_max_body_size 1m;

    # ── Internal path: forward to the real cloud ──────────────────────────
    # Ride-the-API signals forwards with X-Action: forward.  We intercept that
    # response and re-issue the request to the cloud upstream.
    location = /_cloud/ {
        internal;  # only reachable via internal redirect (error_page / X-Accel)
        proxy_pass https://cloud_upstream;
        proxy_set_header Host $http_x_original_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ── Main device traffic → Ride-the-API ────────────────────────────────
    location / {
        proxy_pass http://ride_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Original-Host $host;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;

        # When Ride-the-API returns 502 with X-Action: forward, send the
        # request to the real cloud instead of returning the error.
        error_page 502 = @cloud_redirect;
    }

    # ── Cloud redirect handler ─────────────────────────────────────────────
    location @cloud_redirect {
        # Proxy the ORIGINAL request method/body to the cloud upstream.
        # Uses the resolver above (8.8.8.8 / 1.1.1.1, IPv6 enabled).
        proxy_pass https://cloud_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
}

# ── TCP stream proxy for non-HTTP protocols (MQTT, raw TCP) ───────────────────
# nginx stream module proxies MQTT/raw TCP to the cloud using the same
# loop-free dual-stack resolver.  Enable per-vendor as needed.
stream {
    # Example: MQTT over TLS to the real broker
    upstream mqtt_cloud {
        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=on;
        server mqtt.example.com:8883;
    }

    server {
        listen 8883 ssl;
        proxy_pass mqtt_cloud;
        proxy_ssl_server_name on;
        proxy_ssl on;
        proxy_connect_timeout 10s;
        proxy_timeout 30s;
    }
}