version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: ride-the-api-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8883:8883"    # MQTT over TLS (stream proxy)
    # NOTE: this mounts the whole certs directory, which also contains the CA private key
    # (ca.key). A compromise of this container is therefore equivalent to holding the CA. Keeping
    # the key out of the mount would require moving it out of certs/; until then, the hardening
    # below and the read-only mount are what limit the exposure.
    volumes:
      - ../deploy/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ../deploy/nginx-entrypoint.sh:/docker-entrypoint.sh:ro
      - ../certs:/etc/nginx/certs:ro
      - nginx-cache:/var/cache/nginx
      - nginx-run:/var/run
    # Needs CAP_NET_BIND_SERVICE for :80 and :443 only; everything else is dropped.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      # Upstream DNS servers for loop-free cloud forwarding
      # Override these to use different DNS providers
      - DNS_PRIMARY=8.8.8.8
      - DNS_FALLBACK=1.1.1.1
      - DNS_PRIMARY_V6=2001:4860:4860::8888
      - DNS_FALLBACK_V6=2606:4700:4700::1111
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    depends_on:
      - ride-the-api
    networks:
      - ride-the-api-net

  ride-the-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # The Dockerfile's last stage is `production-gpu`; without an explicit
      # target Compose builds that one, not the CPU default.
      target: production
    container_name: ride-the-api
    restart: unless-stopped
    ports:
      - "8080:8911"    # Health / dashboard (optional, remove to hide)
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data
      # Learned state lives in ./ridebase (core.db + the per-device DBs), relative
      # to the app working directory: without this mount it stays in the
      # disposable container layer and is lost whenever the container is replaced.
      - ../ridebase:/app/ridebase
      - ../certs:/app/certs   # writable: the app generates/rotates the CA here
      - ../models:/app/models:ro
      - ../logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - CONFIG_PATH=/app/config/config.yaml
    # Binds 8911 inside its own namespace (not privileged), so no capability is needed at all.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - ride-the-api-net

networks:
  ride-the-api-net:
    driver: bridge

volumes:
  nginx-cache:
  nginx-run: