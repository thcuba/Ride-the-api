version: '3.8'

services:
  edge-hvac:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: edge-hvac
    restart: unless-stopped
    ports:
      - "8911:8911"    # Main proxy port
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./certs:/app/certs:ro
      - ./models:/app/models:ro
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    networks:
      - edge-hvac-net
    # Uncomment for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Optional: PostgreSQL for production (instead of SQLite)
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: edge-hvac-postgres
  #   restart: unless-stopped
