version: '3.8'

services:
  ride-the-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ride-the-api
    restart: unless-stopped
    ports:
      - "8911:8911"    # Main proxy port
      - "8080:8080"    # Health / dashboard
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./certs:/app/certs:ro
      - ./models:/app/models:ro
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - CONFIG_PATH=/app/config/config.yaml
    networks:
      - ride-the-api-net
    # Uncomment for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Optional: PostgreSQL for production (instead of per-device SQLite)
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: ride-the-api-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: ride_the_api
  #     POSTGRES_USER: ride_the_api
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - ride-the-api-net

networks:
  ride-the-api-net:
    driver: bridge

volumes:
  postgres_data: