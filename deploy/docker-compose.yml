version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: ride-the-api-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8883:8883"    # MQTT over TLS (stream proxy)
    volumes:
      - ../deploy/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ../deploy/nginx-entrypoint.sh:/docker-entrypoint.sh:ro
      - ../certs:/etc/nginx/certs:ro
    environment:
      # Upstream DNS servers for loop-free cloud forwarding
      # Override these to use different DNS providers
      - DNS_PRIMARY=8.8.8.8
      - DNS_FALLBACK=1.1.1.1
      - DNS_PRIMARY_V6=2001:4860:4860::8888
      - DNS_FALLBACK_V6=2606:4700:4700::1111
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    depends_on:
      - ride-the-api
    networks:
      - ride-the-api-net

  ride-the-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ride-the-api
    restart: unless-stopped
    ports:
      - "8080:8080"    # Health / dashboard (optional, remove to hide)
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data
      - ../certs:/app/certs:ro
      - ../models:/app/models:ro
      - ../logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - CONFIG_PATH=/app/config/config.yaml
    networks:
      - ride-the-api-net

networks:
  ride-the-api-net:
    driver: bridge

volumes:
  postgres_data: