  #     POSTGRES_DB: edge_hvac
  #     POSTGRES_USER: edge_hvac
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - edge-hvac-net

  # Optional: Grafana for dashboards
  # grafana:
  #   image: grafana/grafana:10.4
  #   container_name: edge-hvac-grafana
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - grafana_data:/var/lib/grafana
  #     - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards
  #     - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources
  #   networks:
  #     - edge-hvac-net

  # Optional: Prometheus for metrics
  # prometheus:
  #   image: prom/prometheus:v2.52
  #   container_name: edge-hvac-prometheus
  #   restart: unless-stopped
  #   ports:
  #     - "9091:9090"
  #   volumes:
  #     - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
  #     - prometheus_data:/prometheus
  #   networks:
  #     - edge-hvac-net

networks:
  edge-hvac-net:
    driver: bridge

volumes:
