# Ride the API — Local Cloud Replacement Proxy
# Copy to config.yaml and customize

# ═══════════════════════════════════════════════════════════════════════════════
# CORE SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════

core:
  # Core database (SQLite for dev, PostgreSQL for prod)
  database_url: "sqlite+aiosqlite:///./data/core.db"
  
  # Device-specific protocol databases directory
  device_db_dir: "./data/devices"
  
  # Optional: override device DB URLs (e.g., for PostgreSQL)
  # device_databases:
  #   my_ac: "postgresql://localhost/my_ac_protocol"
  
  # Default context buffer size (128KB, 256KB, 512KB, 1MB, 2MB, 5MB, 10MB)
  default_context_buffer_size: 524288  # 512KB

# ═══════════════════════════════════════════════════════════════════════════════
# PROXY SERVER SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════

proxy:
  host: "0.0.0.0"
  port: 8911
  
  # TLS Configuration (for HTTPS interception)
  tls:
    enabled: true
    cert_file: "./certs/ride-api.pem"
    key_file: "./certs/ride-api.key"
    # Generate self-signed cert trusted by local CA for device trust
    # Or use cert from local CA (mkcert, step-ca, etc.)
  
  # Request processing
  request_timeout: 30  # seconds
  max_request_size: 1048576  # 1MB
  
  # No hardcoded routes — each device is identified dynamically
  # by its adapter and device ID. The vendor field is just a
  # protocol identifier chosen by the user/community.
  
  # Fallback to vendor cloud
  fallback:
    enabled: true
    timeout: 10  # seconds
    retry_count: 2
    # If edge confidence < threshold, forward to cloud
    confidence_threshold: 0.7


# ═══════════════════════════════════════════════════════════════════════════════
# VENDOR CONFIGURATIONS
# ═══════════════════════════════════════════════════════════════════════════════

vendors:
  example:
    enabled: true
    # Example cloud API endpoints (for fallback)
    cloud:
      api_endpoint: "https://openapi.example.com"
      mqtt_endpoint: "mqtt.example.com"
      mqtt_port: 8883
    # Protocol adapter settings
    adapter:
      class: "adapters.example.ExampleProtocolAdapter"
      # Region config
      region: "eu"  # eu, us, cn, in
      api_version: "v1.0"


# ═══════════════════════════════════════════════════════════════════════════════
# MODEL SERVING SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════

models:
  # Model registry path (relative to vendor DB dir)
  registry_path: "models"
  
  # Default model per vendor/device_type (can be overridden in DB)
  defaults:
    example:
      ac: "example_ac_v1.onnx"
      heat_pump: "example_hp_v1.onnx"
  
  # Inference settings
  inference:
    batch_size: 1
    intra_op_threads: 2
    inter_op_threads: 2
    # Execution providers: CPUExecutionProvider, CUDAExecutionProvider, TensorrtExecutionProvider
    execution_providers: ["CPUExecutionProvider"]
  
  # Hot reload
  hot_reload:
    enabled: true
    check_interval: 30  # seconds


# ═══════════════════════════════════════════════════════════════════════════════
# LEARNING / PRODUCTION PIPELINE SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════

learning:
  enabled: true
  # Default mode for new devices: learning | production
  default_mode: "learning"
  # Match confidence threshold for production mode (0.0 to 1.0)
  # If local match score >= threshold, serve locally; otherwise forward to cloud
  default_match_threshold: 0.85
  # Auto-switch to production when conditions are met
  auto_switch_to_production: false
  # Minimum patterns needed before auto-switch
  min_patterns_for_production: 10
  # Minimum match rate before auto-switch
  min_match_rate_for_production: 80.0

# ═══════════════════════════════════════════════════════════════════════════════
# CONTROL LOGIC SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════

control:
  # Policy engine
  policy:
    evaluation_interval: 60  # seconds
    default_policy: "pid_thermal"
  
  # Online learning
  online_learning:
    enabled: true
    buffer_size: 1000
    update_interval: 3600  # seconds
    min_samples_for_update: 100

# ═══════════════════════════════════════════════════════════════════════════════
# TRAFFIC SELECTION (UI-managed intercept vs passthrough rules)
# ═══════════════════════════════════════════════════════════════════════════════

traffic_selection:
  # Default action for unmatched traffic: intercept | passthrough
  default_action: "intercept"
  
  # Rules evaluated in priority order (higher = first)
  # Can be managed via UI/API
  rules:
    # Example: intercept local HVAC subnet
    - name: "local_hvac_subnet"
      scope: "local"           # local | external
      match_type: "cidr"       # cidr | hostname | vendor | device_id
      match_value: "192.168.1.0/24"
      action: "intercept"      # intercept | passthrough
      priority: 10
      enabled: true
    
    # Example: intercept cloud hostnames
    - name: "example_cloud"
      scope: "external"
      match_type: "hostname"
      match_value: "*.example.com"
      action: "intercept"
      priority: 10
      enabled: true
    
    # Example: passthrough firmware updates
    - name: "firmware_passthrough"
      scope: "external"
      match_type: "hostname"
      match_value: "firmware.example.com"
      action: "passthrough"
      priority: 20
      enabled: true


# ═══════════════════════════════════════════════════════════════════════════════
# LLM DECIPHERING SERVICE (Configurable per-device LLM for analysis)
# ═══════════════════════════════════════════════════════════════════════════════

llm_decipher:
  enabled: true
  default_profile: "default"

  profiles:
    # Default profile - works with any OpenAI-compatible API
    default:
      base_url: "https://api.openai.com/v1"
      api_key: "${OPENAI_API_KEY}"
      model_id: "gpt-4o-mini"
      # Prompt template for batch protocol analysis
      prompt_template: |
        Analyze the following intercepted device communication pairs.
        The device communicates with a cloud API using a specific protocol.
        Your task is to decode the protocol and extract patterns.

        Device: {device_id} ({vendor} {device_type})

        Communication pairs (request → response):
        {pairs}

        For each pattern you identify, output JSON with:
        - intent: what the device is trying to do (get_state, set_temperature, set_mode, turn_on, turn_off, get_status, update_firmware, heartbeat, etc.)
        - method: HTTP method used (GET, POST, PUT, etc.)
        - path: request path pattern (use {param} for variable parts)
        - request_headers: list of required header keys
        - body_schema: expected body fields with types
        - query_param_keys: expected query parameter keys
        - response: object with status_code, headers (template), body (template with {variables} for dynamic values)
        - field_mappings: object mapping request fields to response fields, e.g. {"body.temp_set": {"response_field": "body.temp_set", "type": "float", "transform": "direct"}}
        - expected_variables: list of variable names in the response body template
        - confidence: 0.0-1.0 confidence score

        Output format: {"patterns": [pattern1, pattern2, ...]}

    # DP-based protocol profile
    dp_protocol:
      base_url: "https://api.openai.com/v1"
      api_key: "${OPENAI_API_KEY}"
      model_id: "gpt-4o-mini"
      prompt_template: |
        Analyze IoT protocol messages using DP (Data Point) codes.
        Common DP codes: 1=power, 2=mode, 3=temp_set, 4=temp_current, 5=fan_speed, 6=swing, 7=humidity, 8=outdoor_temp, 9=power_consumption

        Device: {device_id} ({vendor} {device_type})

        Communication pairs:
        {pairs}

        Output JSON with:
        - patterns: array of decoded patterns
        Each pattern:
        - intent: get_state | set_temperature | set_mode | set_fan | turn_on | turn_off | firmware_check | heartbeat
        - method: request method
        - path: request path
        - body_schema: {dp_code: {value, type, description}}
        - field_mappings: {request_field: {response_field, type, transform, enum_values}}
        - response: {status_code, headers, body_template, expected_variables}
        - confidence: 0.0-1.0

    # Local Ollama profile
    local_ollama:
      base_url: "http://localhost:11434/v1"
      api_key: "ollama"
      model_id: "llama3.1:8b"
      prompt_template: |
        Analyze device communication pairs for {device_id} ({vendor} {device_type}).

        Pairs:
        {pairs}

        Output JSON with patterns array containing: intent, method, path, body_schema, field_mappings, response template, and confidence.


# TLS DECRYPTION ENGINE (MITM proxy for HTTPS/MQTTS/CoAPS)
# ════════════════════════════════════════════════════════════════════════════════

tls_decrypt:
  enabled: false  # disabled by default; enable after setting up DNS routing

  # Ports to listen on for TLS interception
  # The proxy accepts TLS connections on ALL these ports simultaneously.
  # Device identity is determined by SOURCE IP, not by port.
  listen_ports:
    - 443
    - 8883
    - 5684
    - 8443

  # CA certificate for MITM (auto-generated on first run in ./certs/)
  ca_cert_path: "./certs/ca.pem"
  ca_key_path: "./certs/ca.key"

  # Per-device leaf certificate storage (auto-generated per hostname/SNI)
  device_certs_dir: "./data/device_certs"

  # Certificate pinning bypass strategies per vendor
  # Options: "mitm_proxy" (default), "frida", "disable_pin_check"
  # - mitm_proxy: dual-handshake — proxy terminates TLS with dynamic cert,
  #               opens second TLS to real cloud for forwarding
  # - frida:       expose a Frida JS script at /api/tls/frida/script.js
  #               user runs it on-device: frida -U -l script.js <app>
  # - disable_pin_check: assume device already trusts our CA
  pinning_bypass:
    example:
      strategy: "mitm_proxy"

  # TLS versions to support
  min_version: "TLSv1.2"
  max_version: "TLSv1.3"


# ════════════════════════════════════════════════════════════════════════════════
# ON-THE-FLY MODIFICATION ENGINE (Request/Response transformation rules)
# ════════════════════════════════════════════════════════════════════════════════

modification:
  enabled: true
  # Rules managed via UI/API
  rules: []


# ════════════════════════════════════════════════════════════════════════════════
# CORRELATION ENGINE (Request/Response matching)
# ════════════════════════════════════════════════════════════════════════════════

correlation:
  enabled: true
  
  # Matching strategies per protocol
  http:
    method: "connection"      # connection | correlation_id | sequence
    correlation_header: "X-Request-ID"
    keep_alive_timeout: 30    # seconds
  
  mqtt:
    method: "topic_sequence"  # topic_sequence | correlation_data
    qos_tracking: true
    retain_handling: "include"
  
  coap:
    method: "message_id"      # message_id | token
    confirmable_timeout: 5    # seconds
  
  # Storage
  store_pairs: true
  max_pairs_per_device: 10000
  pair_ttl_hours: 168  # 1 week




# ═══════════════════════════════════════════════════════════════════════════════
# OBSERVABILITY
# ═══════════════════════════════════════════════════════════════════════════════

observability:
  logging:
    level: "INFO"
    format: "json"  # json, console
    output: "stdout"
  
  metrics:
    enabled: true
    port: 9090
    path: "/metrics"
  
  tracing:
    enabled: true
    exporter: "console"  # console, otlp, jaeger
    otlp_endpoint: "http://localhost:4317"
    sample_rate: 0.1
  
  health_check:
    enabled: true
    port: 8080
    path: "/health"


# ═══════════════════════════════════════════════════════════════════════════════
# DNS CONFIGURATION (for documentation)
# ═══════════════════════════════════════════════════════════════════════════════

dns:
  # Example dnsmasq configuration for local DNS interception
  # Add to /etc/dnsmasq.d/ride-api.conf:
  #
  # # Device cloud hostnames
  # address=/mqtt.example.com/192.168.1.100
  # address=/api.example.com/192.168.1.100
  # address=/openapi.example.com/192.168.1.100
  #
  # # Port mapping (if needed, use iptables or proxy config)
  # # iptables -t nat -A PREROUTING -d 192.168.1.100 -p tcp --dport 443 -j REDIRECT --to-port 8911
  # # iptables -t nat -A PREROUTING -d 192.168.1.100 -p tcp --dport 8883 -j REDIRECT --to-port 8911
  #
  # Then: sudo systemctl restart dnsmasq
  
  # Example Pi-hole custom DNS entries
  pihole_custom_dns: |
    192.168.1.100 mqtt.example.com
    192.168.1.100 api.example.com
    192.168.1.100 openapi.example.com
  
  # Example AdGuard Home rewrites
  adguard_rewrites: |
    mqtt.example.com -> 192.168.1.100
    api.example.com -> 192.168.1.100
    openapi.example.com -> 192.168.1.100
